name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROFILE: lgpl
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  quality:
    name: Quality (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify playback fixture checksums
        working-directory: crates/erika/testdata/playback
        run: sha256sum --check SHA256SUMS
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check license policy
        run: cargo run --locked -p xtask -- check license
      - name: Verify vendored Cargo patches
        run: cargo run --locked -p xtask -- check cargo-patches
      - name: Get Flutter dependencies
        working-directory: packages/erika_flutter
        run: flutter pub get
      - name: Analyze Flutter package
        working-directory: packages/erika_flutter
        run: flutter analyze --no-pub
      - name: Test Flutter package
        working-directory: packages/erika_flutter
        run: flutter test --no-pub --reporter expanded
      - name: Validate pub package
        working-directory: packages/erika_flutter
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: flutter pub publish --dry-run
      - name: Test Flutter package outside the monorepo
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/erika_flutter"
          git archive HEAD:packages/erika_flutter | tar -x -C "$work/erika_flutter"
          test ! -e "$work/crates"
          cd "$work/erika_flutter"
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded

  rust-macos:
    name: Rust (macOS ${{ matrix.arch }})
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-26
          - arch: x64
            target: x86_64-apple-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install native build tools
        run: brew install nasm meson ninja pkg-config
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: native-v2-macos-${{ matrix.target }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Build native dependencies
        run: |
          cargo run --locked -p xtask -- deps build --all \
            --profile "$PROFILE" --target "${{ matrix.target }}"
      - name: Build C API library
        run: >-
          ERIKA_NATIVE_PROFILE="$PROFILE"
          ERIKA_NATIVE_TARGET="${{ matrix.target }}"
          cargo build --locked -p erika_capi --release
          --target "${{ matrix.target }}"
      - name: Test core library
        if: matrix.arch == 'arm64'
        run: >-
          ERIKA_NATIVE_PROFILE="$PROFILE"
          ERIKA_NATIVE_TARGET="${{ matrix.target }}"
          cargo test --locked -p erika --lib
      - name: Test C API library
        if: matrix.arch == 'arm64'
        run: >-
          ERIKA_NATIVE_PROFILE="$PROFILE"
          ERIKA_NATIVE_TARGET="${{ matrix.target }}"
          cargo test --locked -p erika_capi --lib
      - name: Clippy core crate
        if: matrix.arch == 'arm64'
        run: >-
          ERIKA_NATIVE_PROFILE="$PROFILE"
          ERIKA_NATIVE_TARGET="${{ matrix.target }}"
          cargo clippy --locked -p erika --all-targets --all-features
          --no-deps
      - name: Build wgpu_decode_png example
        if: matrix.arch == 'arm64'
        run: >-
          ERIKA_NATIVE_PROFILE="$PROFILE"
          ERIKA_NATIVE_TARGET="${{ matrix.target }}"
          MACOSX_DEPLOYMENT_TARGET=13.0
          RUSTFLAGS="-C link-arg=-Wl,-U,___isPlatformVersionAtLeast"
          cargo build --locked -p wgpu_decode_png --release
          --target "${{ matrix.target }}"
      - name: Package erika-capi bundle
        if: matrix.arch == 'arm64'
        run: >-
          bash packaging/bundle.sh erika-capi-macos-arm64
          dist/erika-capi-macos-arm64.zip
          "target/${{ matrix.target }}/release/liberika_capi.a"
      - name: Upload test artifacts
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: dv-test-macos-arm64
          path: |
            target/aarch64-apple-darwin/release/wgpu_decode_png
            dist/erika-capi-macos-arm64.zip
          if-no-files-found: error

  ios:
    name: iOS device staticlib
    runs-on: macos-26
    timeout-minutes: 150
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install native build tools
        run: brew install nasm meson ninja pkg-config
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: native-v2-ios-device-aarch64-min${{ env.IPHONEOS_DEPLOYMENT_TARGET }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Build iOS native dependencies
        run: >-
          cargo run --locked -p xtask -- deps build --all
          --profile "$PROFILE" --target aarch64-apple-ios
      - name: Compile iOS static library
        run: |
          ERIKA_NATIVE_PROFILE="$PROFILE" ERIKA_NATIVE_TARGET="aarch64-apple-ios" \
          cargo rustc --locked -p erika_capi --lib --release \
              --target aarch64-apple-ios \
              --no-default-features --features libass --crate-type staticlib

  tvos:
    name: tvOS simulator staticlib
    runs-on: macos-26
    timeout-minutes: 150
    env:
      TVOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install native build tools
        run: brew install nasm meson ninja pkg-config
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: native-v2-tvos-simulator-aarch64-min${{ env.TVOS_DEPLOYMENT_TARGET }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Build tvOS native dependencies
        run: >-
          cargo run --locked -p xtask -- deps build --all
          --profile "$PROFILE" --target aarch64-apple-tvos-sim
      - name: Compile tvOS static library
        run: |
          TVOS_SDKROOT="$(xcrun --sdk appletvsimulator --show-sdk-path)"
          export SDKROOT="$TVOS_SDKROOT"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_tvos_sim="--target=arm64-apple-tvos${TVOS_DEPLOYMENT_TARGET}-simulator -isysroot $TVOS_SDKROOT"
          ERIKA_NATIVE_PROFILE="$PROFILE" ERIKA_NATIVE_TARGET="aarch64-apple-tvos-sim" \
          cargo +nightly rustc -Z build-std=std,panic_abort --locked \
              -p erika_capi --lib --release \
              --target aarch64-apple-tvos-sim \
              --no-default-features --features libass --crate-type staticlib

  windows:
    name: Windows ${{ matrix.arch }} build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            host_arch: AMD64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            msys2: true
          - arch: arm64
            host_arch: ARM64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            msys2: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify native host architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "${{ matrix.host_arch }}") {
            throw "Expected ${{ matrix.host_arch }} host, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Setup MSYS2 tools
        if: matrix.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          path-type: inherit
          install: >-
            make
            tar
            diffutils
            coreutils
            pkgconf
            perl
            zip
      - name: Select MSYS2 tool root
        if: matrix.msys2
        shell: pwsh
        run: |
          "MSYS2_ROOT=C:\msys64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install build tools (nasm, meson, ninja, LLVM/libclang)
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "x64") {
            choco install -y --no-progress nasm zip
          } elseif (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install -y --no-progress make
          }
          pip install --quiet meson ninja
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
          git config --global core.longpaths true
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: native-v2-windows-${{ matrix.target }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Verify FFmpeg make shell
        shell: pwsh
        run: |
          cargo run --locked -p xtask -- deps smoke-ffmpeg-make `
            --profile "$env:PROFILE" `
            --target "${{ matrix.target }}"
      - name: Build native dependencies
        shell: bash
        run: >-
          cargo run --locked -p xtask -- deps build --all
          --profile "$PROFILE" --target "${{ matrix.target }}"
      - name: Build C API
        shell: bash
        run: |
          ERIKA_NATIVE_PROFILE="$PROFILE" ERIKA_NATIVE_TARGET="${{ matrix.target }}" \
            cargo build --locked -p erika_capi --release \
              --target "${{ matrix.target }}"
