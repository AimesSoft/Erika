# Builds every package. A tag like v0.1.0 publishes them as a GitHub release;
# running the workflow by hand only keeps them as artifacts of the run.
#
# Package names: Erika-<version>-<system>-<architecture>[-headless].<extension>.
# A headless package has no window: it is the engine host, the command line, the
# MCP server and the WebUI.

name: Release

on:
  push:
    tags: ["v*"]
    branches: [release-ci]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BERN_VERSION: 0.1.7

jobs:
  # The browser half of playback, the same for every WebUI.
  web:
    name: Browser playback
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # liberika's checkout has no toolchain file of its own.
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup target add wasm32-unknown-unknown
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.23"
          actions-cache-folder: emsdk-cache
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm pkg-config python3-venv
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build
        run: python3 web/build.py "$RUNNER_TEMP/extension"
      - uses: actions/upload-artifact@v4
        with:
          name: web-extension
          path: ${{ runner.temp }}/extension
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-26, target: macos, system: macos, arch: arm64, native: aarch64-apple-darwin }
          - { name: macOS x64, os: macos-26-intel, target: macos, system: macos, arch: x64, native: x86_64-apple-darwin }
          - { name: macOS arm64 headless, os: macos-26, target: web_ui, system: macos, arch: arm64, native: aarch64-apple-darwin, headless: true }
          - { name: macOS x64 headless, os: macos-26-intel, target: web_ui, system: macos, arch: x64, native: x86_64-apple-darwin, headless: true }
          - { name: Windows x64, os: windows-latest, target: windows, system: windows, arch: x64, native: x86_64-pc-windows-msvc }
          - { name: Windows arm64, os: windows-11-arm, target: windows, system: windows, arch: arm64, native: aarch64-pc-windows-msvc }
          - { name: Windows x64 headless, os: windows-latest, target: web_ui, system: windows, arch: x64, native: x86_64-pc-windows-msvc, headless: true }
          - { name: Windows arm64 headless, os: windows-11-arm, target: web_ui, system: windows, arch: arm64, native: aarch64-pc-windows-msvc, headless: true }
          - { name: Linux x64, os: ubuntu-24.04, container: "ubuntu:26.04", target: linux, system: linux, arch: x64, native: x86_64-unknown-linux-gnu }
          - { name: Linux arm64, os: ubuntu-24.04-arm, container: "ubuntu:26.04", target: linux, system: linux, arch: arm64, native: aarch64-unknown-linux-gnu }
          - { name: Linux x64 headless, os: ubuntu-24.04, container: "ubuntu:26.04", target: web_ui, system: linux, arch: x64, native: x86_64-unknown-linux-gnu, headless: true }
          - { name: Linux arm64 headless, os: ubuntu-24.04-arm, container: "ubuntu:26.04", target: web_ui, system: linux, arch: arm64, native: aarch64-unknown-linux-gnu, headless: true }
          - { name: Android, os: ubuntu-24.04, target: android, system: android, arch: arm64 }
          - { name: iOS, os: macos-26, target: ios, system: ios, arch: arm64 }
          - { name: Apple TV, os: macos-26, target: tvos, system: tvos, arch: arm64 }
    steps:
      # Linux builds in Ubuntu 26.04, the first with the FFmpeg 8 liberika needs.
      - name: Linux libraries
        if: runner.os == 'Linux' && matrix.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang curl file git libclang-dev meson nasm ninja-build \
            patch pkg-config python3 sudo xz-utils zip \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            libfontconfig-dev libfreetype-dev libfribidi-dev libharfbuzz-dev \
            libpulse-dev libvulkan-dev libwayland-dev libx11-dev libxkbcommon-dev \
            libdbus-1-dev libasound2-dev \
            libadwaita-1-dev libgtk-4-dev libsoup-3.0-dev libwebkitgtk-6.0-dev

      - uses: actions/checkout@v4

      - name: Rustup
        if: matrix.container || (runner.arch == 'ARM64' && runner.os != 'macOS')
        shell: bash
        run: |
          if command -v rustup >/dev/null; then
            exit 0
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            curl --proto '=https' --tlsv1.2 -sSfLo rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\.cargo\bin" >> "$GITHUB_PATH"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.system }}-${{ matrix.arch }}-${{ matrix.target }}
          workspaces: . -> target

      - name: Apple tools
        if: runner.os == 'macOS' && matrix.native
        run: brew install meson nasm ninja pkg-config

      - name: MSYS2
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          path-type: inherit
          install: >-
            make
            tar
            diffutils
            coreutils
            pkgconf
            perl
            zip

      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "x64") {
            "MSYS2_ROOT=C:\msys64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            choco install -y --no-progress nasm
          } elseif (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install -y --no-progress make
          }
          pip install --quiet meson ninja
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
          git config --global core.longpaths true

      - name: Locate liberika
        if: matrix.native
        id: liberika
        shell: bash
        run: |
          cargo fetch --locked
          echo "root=$(python3 web/dependencies.py)" >> "$GITHUB_OUTPUT"
          echo "rev=$(sed -n 's/.*liberika.*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache native dependencies
        if: matrix.native
        uses: actions/cache@v4
        with:
          path: ${{ steps.liberika.outputs.root }}/third_party/dist/${{ matrix.native }}
          key: native-v1-${{ matrix.native }}-${{ steps.liberika.outputs.rev }}-${{ matrix.container }}

      - name: Native dependencies
        if: matrix.native
        shell: bash
        run: bash .github/scripts/native-deps.sh ${{ matrix.native }}

      - name: Browser playback
        if: matrix.headless
        uses: actions/download-artifact@v4
        with:
          name: web-extension
          path: ${{ runner.temp }}/extension

      - name: Browser playback, built
        if: matrix.headless
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          echo "ERIKA_WEB_EXTENSION=$RUNNER_TEMP/extension" >> "$GITHUB_ENV"

      - name: iOS targets
        if: matrix.target == 'ios'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Apple TV targets
        if: matrix.target == 'tvos'
        run: rustup target add aarch64-apple-tvos aarch64-apple-tvos-sim

      - name: Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Android SDK and NDK
        if: matrix.target == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      # Without the secret the APK is signed with a debug key, which cannot
      # update an installed release.
      - name: Android signing key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/erika-release.jks"
            echo "BERN_ANDROID_KEYSTORE=$RUNNER_TEMP/erika-release.jks" >> "$GITHUB_ENV"
            echo "BERN_ANDROID_KEY_ALIAS=erika" >> "$GITHUB_ENV"
          fi

      # The build tool of the Bern Erika depends on. Only the build for this
      # runner's own Rust: an Intel bern under Rosetta takes the Mac for an
      # Intel one and builds for it.
      - uses: cargo-bins/cargo-binstall@v1.26.0
      - name: Bern
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo binstall --no-confirm --targets "$(rustc -vV | sed -n 's/^host: //p')" "bern-cli@$BERN_VERSION"

      - name: Package
        if: runner.os != 'Windows'
        env:
          BERN_ANDROID_KEYSTORE_PASSWORD: ${{ matrix.target == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
        run: bern package --target ${{ matrix.target }}

      # From cmd, so the build fetches the Windows App SDK with Windows' own
      # tar: Git's, first on the bash path, reads "D:" as a host name. The
      # Rust cache brings back target\bern-winrt without all of the packages
      # in it, so they are fetched again.
      - name: Package
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist target\bern-winrt rmdir /s /q target\bern-winrt
          bern package --target ${{ matrix.target }}

      - name: Names
        shell: bash
        run: python3 .github/scripts/name-packages.py ${{ matrix.system }} ${{ matrix.headless == true }} ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: erika-${{ matrix.system }}-${{ matrix.arch }}-${{ matrix.target }}
          path: target/bern/dist/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Bern.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Bern.toml says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: erika-*
          path: dist
          merge-multiple: true

      # The store bundle (.aab) stays in the run's artifacts.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f dist/*.aab
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Erika ${GITHUB_REF_NAME#v}" \
            --generate-notes
