name: Release

# Build prebuilt erika_capi bundles and attach them to a GitHub Release.
#
# Trigger: push a tag like `v0.1.5` to publish. Use the manual "Run workflow"
# button (workflow_dispatch) to dry-run the builds without publishing (the
# publish job is gated on a tag ref).
#
# Bundles (per platform): liberika_capi.{dylib,a} / erika_capi.dll + libs /
# iOS/tvOS erika_capi.xcframework bundles / Android ABI archives /
# OpenHarmony shared libraries,
# plus erika.h, LICENSE (MPL-2.0), and THIRD_PARTY_NOTICES.md. Native deps
# (FFmpeg/libass/...) are statically linked via the `lgpl` profile.
#
# Windows uses MSYS2 + MSVC + LLVM/libclang. Android uses NDK LLVM at API 26;
# xtask supports both Linux-hosted CI and Windows-hosted Git Bash builds.
#
# NOTE: desktop Linux is intentionally not published yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROFILE: lgpl
  ANDROID_API_LEVEL: "26"
  ANDROID_NDK_VERSION: "29.0.14206865"
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-26
          - arch: x64
            target: x86_64-apple-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install native build tools
        run: brew install nasm meson ninja pkg-config
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: native-v2-macos-${{ matrix.target }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Build native deps + erika_capi
        run: |
          cargo run -p xtask -- deps build --all --profile "$PROFILE" --target "${{ matrix.target }}"
          ERIKA_NATIVE_PROFILE="$PROFILE" ERIKA_NATIVE_TARGET="${{ matrix.target }}" \
            cargo build -p erika_capi --release --target "${{ matrix.target }}"
      - name: Stage architecture libraries
        run: |
          mkdir -p "out/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/liberika_capi.dylib" "out/${{ matrix.arch }}/"
          cp "target/${{ matrix.target }}/release/liberika_capi.a" "out/${{ matrix.arch }}/"
          install_name_tool -id @rpath/liberika_capi.dylib "out/${{ matrix.arch }}/liberika_capi.dylib"
      - name: Package
        run: |
          bash packaging/bundle.sh "erika-capi-macos-${{ matrix.arch }}" \
            "dist/erika-capi-macos-${{ matrix.arch }}.zip" \
            "out/${{ matrix.arch }}/liberika_capi.dylib" \
            "out/${{ matrix.arch }}/liberika_capi.a"
      - uses: actions/upload-artifact@v4
        with:
          name: erika-capi-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            out/${{ matrix.arch }}/*

  macos-universal:
    name: macOS universal
    needs: macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: erika-capi-macos-*
          path: artifacts
      - name: Make universal libraries
        run: |
          ARM64=artifacts/erika-capi-macos-arm64/out/arm64
          X64=artifacts/erika-capi-macos-x64/out/x64
          mkdir -p out/universal
          lipo -create "$ARM64/liberika_capi.dylib" "$X64/liberika_capi.dylib" \
            -output out/universal/liberika_capi.dylib
          lipo -create "$ARM64/liberika_capi.a" "$X64/liberika_capi.a" \
            -output out/universal/liberika_capi.a
          install_name_tool -id @rpath/liberika_capi.dylib out/universal/liberika_capi.dylib
      - name: Package
        run: |
          bash packaging/bundle.sh erika-capi-macos-universal \
            dist/erika-capi-macos-universal.zip \
            out/universal/liberika_capi.dylib out/universal/liberika_capi.a
      - uses: actions/upload-artifact@v4
        with:
          name: erika-capi-macos-universal
          path: dist/*.zip

  ios:
    name: iOS (XCFramework)
    runs-on: macos-26
    timeout-minutes: 180
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
      LANG: C
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install native build tools
        run: brew install nasm meson ninja pkg-config
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: native-v2-ios-release-all-min${{ env.IPHONEOS_DEPLOYMENT_TARGET }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Build native deps + erika_capi (device + simulators)
        # iOS links against the static lib only (XCFramework). Build just the
        # staticlib via `cargo rustc --crate-type staticlib` so the cdylib link
        # (which iOS does not use and which fails to resolve here) is skipped.
        run: |
          set -euo pipefail
          for ENTRY in \
            "aarch64-apple-ios|iphoneos|arm64-apple-ios${IPHONEOS_DEPLOYMENT_TARGET}" \
            "aarch64-apple-ios-sim|iphonesimulator|arm64-apple-ios${IPHONEOS_DEPLOYMENT_TARGET}-simulator" \
            "x86_64-apple-ios|iphonesimulator|x86_64-apple-ios${IPHONEOS_DEPLOYMENT_TARGET}-simulator"
          do
            IFS='|' read -r T SDK CLANG_TARGET <<< "$ENTRY"
            SDKROOT="$(xcrun --sdk "$SDK" --show-sdk-path)"
            BINDGEN_KEY="${T//-/_}"
            export SDKROOT
            export "BINDGEN_EXTRA_CLANG_ARGS_${BINDGEN_KEY}=--target=${CLANG_TARGET} -isysroot ${SDKROOT}"
            cargo run -p xtask -- deps build --all --profile "$PROFILE" --target "$T"
            ERIKA_NATIVE_PROFILE="$PROFILE" ERIKA_NATIVE_TARGET="$T" \
            cargo rustc -p erika_capi --lib --release --target "$T" \
                --no-default-features --features libass --crate-type staticlib
          done
      - name: Assemble XCFramework
        run: |
          mkdir -p out hdr
          cp crates/erika_capi/include/erika.h hdr/erika.h
          # Fat static lib for the simulator slice (arm64 + x86_64).
          lipo -create \
            target/aarch64-apple-ios-sim/release/liberika_capi.a \
            target/x86_64-apple-ios/release/liberika_capi.a \
            -output out/liberika_capi-sim.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/liberika_capi.a -headers hdr \
            -library out/liberika_capi-sim.a -headers hdr \
            -output out/erika_capi.xcframework
      - name: Package
        run: |
          bash packaging/bundle.sh erika-capi-ios \
            dist/erika-capi-ios.zip out/erika_capi.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: erika-capi-ios
          path: dist/*.zip

  tvos:
    name: tvOS (XCFramework)
    runs-on: macos-26
    timeout-minutes: 240
    env:
      TVOS_DEPLOYMENT_TARGET: "13.0"
      LANG: C
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install native build tools
        run: brew install nasm meson ninja pkg-config
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: native-v2-tvos-release-all-min${{ env.TVOS_DEPLOYMENT_TARGET }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Build native deps + erika_capi (device + simulators)
        run: |
          set -euo pipefail
          for ENTRY in \
            "aarch64-apple-tvos|appletvos|arm64-apple-tvos${TVOS_DEPLOYMENT_TARGET}" \
            "aarch64-apple-tvos-sim|appletvsimulator|arm64-apple-tvos${TVOS_DEPLOYMENT_TARGET}-simulator" \
            "x86_64-apple-tvos|appletvsimulator|x86_64-apple-tvos${TVOS_DEPLOYMENT_TARGET}-simulator"
          do
            IFS='|' read -r T SDK CLANG_TARGET <<< "$ENTRY"
            SDKROOT="$(xcrun --sdk "$SDK" --show-sdk-path)"
            BINDGEN_KEY="${T//-/_}"
            export SDKROOT
            export "BINDGEN_EXTRA_CLANG_ARGS_${BINDGEN_KEY}=--target=${CLANG_TARGET} -isysroot ${SDKROOT}"
            cargo run --locked -p xtask -- deps build --all \
              --profile "$PROFILE" --target "$T"
            ERIKA_NATIVE_PROFILE="$PROFILE" ERIKA_NATIVE_TARGET="$T" \
              cargo +nightly rustc -Z build-std=std,panic_abort --locked \
                -p erika_capi --lib --release --target "$T" \
                --no-default-features --features libass --crate-type staticlib
          done
      - name: Assemble XCFramework
        run: |
          mkdir -p out hdr
          cp crates/erika_capi/include/erika.h hdr/erika.h
          lipo -create \
            target/aarch64-apple-tvos-sim/release/liberika_capi.a \
            target/x86_64-apple-tvos/release/liberika_capi.a \
            -output out/liberika_capi-sim.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-tvos/release/liberika_capi.a -headers hdr \
            -library out/liberika_capi-sim.a -headers hdr \
            -output out/erika_capi.xcframework
      - name: Package
        run: |
          bash packaging/bundle.sh erika-capi-tvos \
            dist/erika-capi-tvos.zip out/erika_capi.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: erika-capi-tvos
          path: dist/*.zip

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            host_arch: AMD64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            msys2: true
          - arch: arm64
            host_arch: ARM64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            msys2: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify native host architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "${{ matrix.host_arch }}") {
            throw "Expected ${{ matrix.host_arch }} host, got $env:PROCESSOR_ARCHITECTURE"
          }
      - name: Setup MSYS2 tools
        if: matrix.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          path-type: inherit
          install: >-
            make
            tar
            diffutils
            coreutils
            pkgconf
            perl
            zip
      - name: Select MSYS2 tool root
        if: matrix.msys2
        shell: pwsh
        run: |
          "MSYS2_ROOT=C:\msys64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install build tools (nasm, meson, ninja, LLVM/libclang)
        shell: pwsh
        run: |
          choco install -y --no-progress zip
          if ("${{ matrix.arch }}" -eq "x64") {
            choco install -y --no-progress nasm
          } elseif (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install -y --no-progress make
          }
          pip install --quiet meson ninja
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
          git config --global core.longpaths true
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: native-v2-windows-${{ matrix.target }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Verify FFmpeg make shell
        shell: pwsh
        run: |
          cargo run --locked -p xtask -- deps smoke-ffmpeg-make `
            --profile "$env:PROFILE" `
            --target "${{ matrix.target }}"
      - name: Build native deps + erika_capi
        shell: bash
        run: |
          cargo run -p xtask -- deps build --all --profile "$PROFILE" --target "${{ matrix.target }}"
          ERIKA_NATIVE_PROFILE="$PROFILE" ERIKA_NATIVE_TARGET="${{ matrix.target }}" \
            cargo build -p erika_capi --release --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          R=target/${{ matrix.target }}/release
          bash packaging/bundle.sh erika-capi-windows-${{ matrix.arch }} \
            dist/erika-capi-windows-${{ matrix.arch }}.zip \
            "$R/erika_capi.dll" "$R/erika_capi.dll.lib" "$R/erika_capi.lib"
      - uses: actions/upload-artifact@v4
        with:
          name: erika-capi-windows-${{ matrix.arch }}
          path: dist/*.zip

  android:
    name: Android (4 ABIs)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and native build tools
        run: |
          sdkmanager "ndk;$ANDROID_NDK_VERSION"
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make meson nasm ninja-build pkg-config libclang-dev python3-venv
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Cache Android native dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: native-v2-android-release-all-ndk${{ env.ANDROID_NDK_VERSION }}-api${{ env.ANDROID_API_LEVEL }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Build native deps + erika_capi (all ABIs)
        shell: bash
        run: |
          set -euo pipefail
          PREBUILT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          TOOLCHAIN="$PREBUILT/bin"
          LIBCLANG_FILE="$(find "$PREBUILT" -type f -name 'libclang.so*' -print -quit)"
          test -n "$LIBCLANG_FILE"
          LIBCLANG_PATH="$(dirname "$LIBCLANG_FILE")"
          test -d "$LIBCLANG_PATH"
          export LIBCLANG_PATH
          mkdir -p out/android
          for ENTRY in \
            "aarch64-linux-android|arm64-v8a|aarch64-linux-android|aarch64-linux-android" \
            "armv7-linux-androideabi|armeabi-v7a|armv7a-linux-androideabi|arm-linux-androideabi" \
            "x86_64-linux-android|x86_64|x86_64-linux-android|x86_64-linux-android" \
            "i686-linux-android|x86|i686-linux-android|i686-linux-android"; do
            IFS='|' read -r T ABI CLANG_T CXX_RUNTIME_T <<< "$ENTRY"
            CC="$TOOLCHAIN/${CLANG_T}${ANDROID_API_LEVEL}-clang"
            CXX="$TOOLCHAIN/${CLANG_T}${ANDROID_API_LEVEL}-clang++"
            AR="$TOOLCHAIN/llvm-ar"
            CARGO_KEY="$(echo "$T" | tr '[:lower:]-' '[:upper:]_')"
            CC_KEY="${T//-/_}"
            export "CARGO_TARGET_${CARGO_KEY}_LINKER=$CC"
            export "CC_${CC_KEY}=$CC" "CXX_${CC_KEY}=$CXX" "AR_${CC_KEY}=$AR"
            export "BINDGEN_EXTRA_CLANG_ARGS_${CC_KEY}=--target=${CLANG_T}${ANDROID_API_LEVEL} --sysroot=$PREBUILT/sysroot"
            export "CFLAGS_${CC_KEY}=-fPIC" "CXXFLAGS_${CC_KEY}=-fPIC"
            cargo run -p xtask -- deps build --all --profile "$PROFILE" --target "$T"
            ERIKA_NATIVE_PROFILE="$PROFILE" ERIKA_NATIVE_TARGET="$T" \
              cargo build -p erika_capi --release --target "$T" \
                --no-default-features --features libass,wgpu
            mkdir -p "out/android/$ABI"
            cp "target/$T/release/liberika_capi.a" "out/android/$ABI/liberika_capi.a"
            cp "target/$T/release/liberika_capi.so" "out/android/$ABI/liberika_capi.so"
            cp "$PREBUILT/sysroot/usr/lib/$CXX_RUNTIME_T/libc++_shared.so" \
              "out/android/$ABI/libc++_shared.so"
          done
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ERIKA_NATIVE_PROFILE="$PROFILE" bash packaging/bundle.sh \
            erika-capi-android dist/erika-capi-android.zip out/android
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            ERIKA_NATIVE_PROFILE="$PROFILE" bash packaging/bundle.sh \
              "erika-flutter-android-$ABI" \
              "dist/erika-flutter-android-$ABI.zip" \
              "out/android/$ABI/liberika_capi.so" \
              "out/android/$ABI/libc++_shared.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: erika-capi-android
          path: dist/*.zip

  openharmony:
    name: OpenHarmony arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ERIKA_NATIVE_PROFILE: lgpl
      ERIKA_NATIVE_TARGET: aarch64-unknown-linux-ohos
      OHOS_COMPATIBLE_SDK_VERSION: "18"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: aarch64-unknown-linux-ohos
      - name: Setup OpenHarmony SDK
        id: ohos_sdk
        uses: openharmony-rs/setup-ohos-sdk@b312caf8a43bb836aa24c08f65f97e1f09a89cad # v1.0.1
        with:
          version: "5.1.0"
          components: native
          cache: true
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake make ninja-build pkg-config zip
      - name: Configure OpenHarmony toolchain
        env:
          NATIVE_ROOT: ${{ steps.ohos_sdk.outputs.ohos_sdk_native }}
        run: |
          set -euo pipefail
          test -x "$NATIVE_ROOT/llvm/bin/aarch64-unknown-linux-ohos-clang"
          test -x "$NATIVE_ROOT/llvm/bin/aarch64-unknown-linux-ohos-clang++"
          test -f "$NATIVE_ROOT/build/cmake/ohos.toolchain.cmake"
          cxx_include="$NATIVE_ROOT/llvm/include/libcxx-ohos/include/c++/v1"
          if [[ ! -f "$cxx_include/vector" ]]; then
            cxx_include="$NATIVE_ROOT/llvm/include/c++/v1"
          fi
          test -f "$cxx_include/vector"
          {
            echo "OHOS_NDK_HOME=$NATIVE_ROOT"
            echo "OHOS_SDK_NATIVE=$NATIVE_ROOT"
            echo "LIBCLANG_PATH=$NATIVE_ROOT/llvm/lib"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_ohos=--target=aarch64-unknown-linux-ohos --sysroot=$NATIVE_ROOT/sysroot -isystem $cxx_include"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=$NATIVE_ROOT/llvm/bin/aarch64-unknown-linux-ohos-clang"
            echo "CC_aarch64_unknown_linux_ohos=$NATIVE_ROOT/llvm/bin/aarch64-unknown-linux-ohos-clang"
            echo "CXX_aarch64_unknown_linux_ohos=$NATIVE_ROOT/llvm/bin/aarch64-unknown-linux-ohos-clang++"
            echo "AR_aarch64_unknown_linux_ohos=$NATIVE_ROOT/llvm/bin/llvm-ar"
          } >> "$GITHUB_ENV"
      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party/cache
            third_party/src
            third_party/build/${{ env.ERIKA_NATIVE_TARGET }}/${{ env.ERIKA_NATIVE_PROFILE }}
            third_party/dist/${{ env.ERIKA_NATIVE_TARGET }}/${{ env.ERIKA_NATIVE_PROFILE }}
          key: native-v1-ohos-${{ env.ERIKA_NATIVE_TARGET }}-api${{ env.OHOS_COMPATIBLE_SDK_VERSION }}-${{ hashFiles('xtask/src/main.rs', 'third_party/patches/**') }}
      - name: Build OpenHarmony native dependencies
        run: >-
          cargo run --locked -p xtask -- deps build
          --profile "$ERIKA_NATIVE_PROFILE"
          --target "$ERIKA_NATIVE_TARGET"
      - name: Save native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party/cache
            third_party/src
            third_party/build/${{ env.ERIKA_NATIVE_TARGET }}/${{ env.ERIKA_NATIVE_PROFILE }}
            third_party/dist/${{ env.ERIKA_NATIVE_TARGET }}/${{ env.ERIKA_NATIVE_PROFILE }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build OpenHarmony C API
        run: >-
          cargo build --locked -p erika_capi --release
          --target "$ERIKA_NATIVE_TARGET"
          --no-default-features --features wgpu
      - name: Build OpenHarmony Flutter native bridge
        run: |
          set -euo pipefail
          cmake -S packages/erika_flutter/ohos/src/main/cpp \
            -B target/ohos-plugin-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$OHOS_SDK_NATIVE/build/cmake/ohos.toolchain.cmake" \
            -DOHOS_ARCH=arm64-v8a \
            -DOHOS_SDK_NATIVE="$OHOS_SDK_NATIVE"
          cmake --build target/ohos-plugin-release --target erika_flutter_plugin
      - name: Verify and package OpenHarmony libraries
        run: |
          set -euo pipefail
          runtime="target/$ERIKA_NATIVE_TARGET/release/liberika_capi.so"
          plugin="$(find target/ohos-plugin-release -type f -name 'liberika_flutter.so' -print -quit)"
          readelf="$OHOS_SDK_NATIVE/llvm/bin/llvm-readelf"
          nm="$OHOS_SDK_NATIVE/llvm/bin/llvm-nm"
          test -f "$runtime"
          test -n "$plugin"
          test -f "$plugin"
          "$readelf" -h "$runtime" | grep -Eq 'Machine:.*AArch64'
          "$readelf" -d "$runtime" | grep -Eq '\(SONAME\).*liberika_capi\.so'
          symbols="$("$nm" --dynamic --defined-only "$runtime" | awk '{print $NF}')"
          for symbol in \
            erika_presenter_invoke_json \
            erika_presenter_render_tick_json \
            erika_presenter_poll_event_json
          do
            grep -Fxq "$symbol" <<< "$symbols"
          done
          bash packaging/bundle.sh erika-capi-openharmony-arm64 \
            dist/erika-capi-openharmony-arm64.zip "$runtime" "$plugin"
      - uses: actions/upload-artifact@v4
        with:
          name: erika-capi-openharmony-arm64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [macos, macos-universal, ios, tvos, windows, android, openharmony]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          body: |
            Prebuilt `erika_capi` C ABI bundles (static `lgpl` profile),
            for macOS arm64, macOS x64, macOS universal, Windows x64,
            Windows ARM64, iOS, tvOS, and Android arm64-v8a, armeabi-v7a,
            x86_64, and x86, plus OpenHarmony arm64.

            Each archive contains the library, `include/erika.h`, `LICENSE`
            (MPL-2.0), and `THIRD_PARTY_NOTICES.md`. See
            [docs/capi_reference.md](https://github.com/AimesSoft/Erika/blob/${{ github.ref_name }}/docs/capi_reference.md)
            and [docs/integration.md](https://github.com/AimesSoft/Erika/blob/${{ github.ref_name }}/docs/integration.md)
            to integrate. Review [CHANGELOG.md](https://github.com/AimesSoft/Erika/blob/${{ github.ref_name }}/CHANGELOG.md)
            before upgrading, especially the compatibility notes.
