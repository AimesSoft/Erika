# Builds every package. A tag like v0.1.0 publishes them as a GitHub release;
# running the workflow by hand only keeps them as artifacts of the run.
#
# Package names: Erika-<version>-<system>-<architecture>[-headless].<extension>.
# A headless package has no window: it is the engine host, the command line, the
# MCP server and the WebUI.

name: Release

on:
  push:
    tags: ["v*"]
    branches: [release-ci]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BERN_REV: ccfe43fb53595252e34ed9e10e0ce95beaab1339

jobs:
  # The browser half of playback, the same for every WebUI.
  web:
    name: Browser playback
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # liberika's checkout has no toolchain file of its own.
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup target add wasm32-unknown-unknown
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.23"
          actions-cache-folder: emsdk-cache
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm pkg-config python3-venv
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build
        # The WebUI's part: without the font, which the page takes from the
        # device that serves it.
        run: python3 web/build.py --host-font "$RUNNER_TEMP/extension"
      - uses: actions/upload-artifact@v4
        with:
          name: web-extension
          path: ${{ runner.temp }}/extension
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-26, target: macos, system: macos, arch: arm64, native: aarch64-apple-darwin }
          - { name: macOS x64, os: macos-26-intel, target: macos, system: macos, arch: x64, native: x86_64-apple-darwin }
          - { name: macOS arm64 headless, os: macos-26, target: web_ui, system: macos, arch: arm64, native: aarch64-apple-darwin, headless: true }
          - { name: macOS x64 headless, os: macos-26-intel, target: web_ui, system: macos, arch: x64, native: x86_64-apple-darwin, headless: true }
          - { name: Windows x64, os: windows-latest, target: windows, system: windows, arch: x64, native: x86_64-pc-windows-msvc }
          - { name: Windows arm64, os: windows-11-arm, target: windows, system: windows, arch: arm64, native: aarch64-pc-windows-msvc }
          - { name: Windows x64 headless, os: windows-latest, target: web_ui, system: windows, arch: x64, native: x86_64-pc-windows-msvc, headless: true }
          - { name: Windows arm64 headless, os: windows-11-arm, target: web_ui, system: windows, arch: arm64, native: aarch64-pc-windows-msvc, headless: true }
          - { name: Linux x64, os: ubuntu-24.04, container: "ubuntu:26.04", target: linux, system: linux, arch: x64, native: x86_64-unknown-linux-gnu }
          - { name: Linux arm64, os: ubuntu-24.04-arm, container: "ubuntu:26.04", target: linux, system: linux, arch: arm64, native: aarch64-unknown-linux-gnu }
          - { name: Linux x64 headless, os: ubuntu-24.04, container: "ubuntu:26.04", target: web_ui, system: linux, arch: x64, native: x86_64-unknown-linux-gnu, headless: true }
          - { name: Linux arm64 headless, os: ubuntu-24.04-arm, container: "ubuntu:26.04", target: web_ui, system: linux, arch: arm64, native: aarch64-unknown-linux-gnu, headless: true }
          - { name: Android, os: ubuntu-24.04, target: android, system: android, arch: arm64, native: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android }
          - { name: iOS, os: macos-26, target: ios, system: ios, arch: arm64, native: aarch64-apple-ios aarch64-apple-ios-sim }
          - { name: Apple TV, os: macos-26, target: tvos, system: tvos, arch: arm64, native: aarch64-apple-tvos aarch64-apple-tvos-sim }
    steps:
      # Linux builds in Ubuntu 26.04, the first with the FFmpeg 8 liberika needs.
      - name: Linux libraries
        if: runner.os == 'Linux' && matrix.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang curl file git libclang-dev meson nasm ninja-build \
            patch pkg-config python3 sudo xz-utils zip \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            libfontconfig-dev libfreetype-dev libfribidi-dev libharfbuzz-dev \
            libpulse-dev libvulkan-dev libwayland-dev libx11-dev libxkbcommon-dev \
            libdbus-1-dev libasound2-dev \
            libadwaita-1-dev libgtk-4-dev libsoup-3.0-dev libwebkitgtk-6.0-dev

      - uses: actions/checkout@v4

      - name: Rustup
        if: matrix.container || (runner.arch == 'ARM64' && runner.os != 'macOS')
        shell: bash
        run: |
          if command -v rustup >/dev/null; then
            exit 0
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            curl --proto '=https' --tlsv1.2 -sSfLo rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\.cargo\bin" >> "$GITHUB_PATH"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.system }}-${{ matrix.arch }}-${{ matrix.target }}
          workspaces: . -> target

      - name: Apple tools
        if: runner.os == 'macOS' && matrix.native
        run: brew install meson nasm ninja pkg-config

      - name: MSYS2
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          path-type: inherit
          install: >-
            make
            tar
            diffutils
            coreutils
            pkgconf
            perl
            zip

      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "x64") {
            "MSYS2_ROOT=C:\msys64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            choco install -y --no-progress nasm
          } elseif (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install -y --no-progress make
          }
          pip install --quiet meson ninja
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
          git config --global core.longpaths true

      - name: Locate liberika
        if: matrix.native
        id: liberika
        shell: bash
        run: |
          cargo fetch --locked
          echo "root=$(python3 web/dependencies.py)" >> "$GITHUB_OUTPUT"
          echo "rev=$(sed -n 's/.*liberika.*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache native dependencies
        if: matrix.native
        uses: actions/cache@v4
        with:
          path: ${{ steps.liberika.outputs.root }}/third_party/dist
          key: native-v2-${{ matrix.system }}-${{ matrix.arch }}-${{ matrix.native }}-${{ steps.liberika.outputs.rev }}-${{ matrix.container }}

      # Bindgen reads the system headers of what it builds for.
      - name: iOS
        if: matrix.target == 'ios'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          device="$(xcrun --sdk iphoneos --show-sdk-path)"
          simulator="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios=--target=arm64-apple-ios16.0 -isysroot $device" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim=--target=arm64-apple-ios16.0-simulator -isysroot $simulator" >> "$GITHUB_ENV"
          echo "REAL_CARGO=$(command -v cargo)" >> "$GITHUB_ENV"

      - name: Apple TV
        if: matrix.target == 'tvos'
        run: |
          rustup target add aarch64-apple-tvos aarch64-apple-tvos-sim
          device="$(xcrun --sdk appletvos --show-sdk-path)"
          simulator="$(xcrun --sdk appletvsimulator --show-sdk-path)"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_tvos=--target=arm64-apple-tvos17.0 -isysroot $device" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_tvos_sim=--target=arm64-apple-tvos17.0-simulator -isysroot $simulator" >> "$GITHUB_ENV"

      - name: Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Android SDK and NDK
        if: matrix.target == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libclang-dev libdbus-1-dev meson nasm ninja-build pkg-config python3-venv
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          {
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME"
            echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME"
            echo "ANDROID_API_LEVEL=26"
          } >> "$GITHUB_ENV"
          # The NDK's C++ headers need a libclang as new as the NDK's own compiler.
          prebuilt="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          libclang=$(find "$prebuilt" -maxdepth 2 -name 'libclang.so*' | head -n 1)
          if [ -n "$libclang" ]; then
            echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
            echo "CLANG_PATH=$prebuilt/bin/clang" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y clang-20 libclang-20-dev
            echo "LIBCLANG_PATH=/usr/lib/llvm-20/lib" >> "$GITHUB_ENV"
            echo "CLANG_PATH=/usr/lib/llvm-20/bin/clang" >> "$GITHUB_ENV"
          fi
          sysroot="$prebuilt/sysroot"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android26 --sysroot=$sysroot" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--target=armv7a-linux-androideabi26 --sysroot=$sysroot" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android=--target=x86_64-linux-android26 --sysroot=$sysroot" >> "$GITHUB_ENV"

      - name: Native dependencies
        if: matrix.native
        shell: bash
        run: bash .github/scripts/native-deps.sh ${{ matrix.native }}

      # The Windows app links the C runtime statically, and so does the
      # headless host, against the same native libraries.
      - name: Windows host
        if: runner.os == 'Windows' && matrix.headless
        shell: bash
        run: |
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"

      # Every package carries the WebUI; the browser's part is built once.
      - name: Browser playback
        uses: actions/download-artifact@v4
        with:
          name: web-extension
          path: ${{ runner.temp }}/extension

      - name: Browser playback, built
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          echo "ERIKA_WEB_UI_EXTENSION=$RUNNER_TEMP/extension" >> "$GITHUB_ENV"

      # Without the secret the APK is signed with a debug key, which cannot
      # update an installed release.
      - name: Android signing key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/erika-release.jks"
            echo "BERN_ANDROID_KEYSTORE=$RUNNER_TEMP/erika-release.jks" >> "$GITHUB_ENV"
            echo "BERN_ANDROID_KEY_ALIAS=erika" >> "$GITHUB_ENV"
          fi

      # The build tool of the Bern Erika depends on.
      - name: Bern
        shell: bash
        run: cargo install --locked --git https://github.com/AimesSoft/Bern --rev "$BERN_REV" bern-cli

      - name: Package
        if: runner.os != 'Windows'
        env:
          BERN_ANDROID_KEYSTORE_PASSWORD: ${{ matrix.target == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
        run: |
          if [ "${{ matrix.target }}" = ios ]; then
            PATH="$PWD/.github/scripts:$PATH"
          fi
          bern package --target ${{ matrix.target }}

      # From cmd, so the build fetches the Windows App SDK with Windows' own
      # tar: Git's, first on the bash path, reads "D:" as a host name. The
      # Rust cache brings back target\bern-winrt without all of the packages
      # in it, so they are fetched again.
      - name: Package
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist target\bern-winrt rmdir /s /q target\bern-winrt
          bern package --target ${{ matrix.target }}

      - name: Names
        shell: bash
        run: python3 .github/scripts/name-packages.py ${{ matrix.system }} ${{ matrix.headless == true }} ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: erika-${{ matrix.system }}-${{ matrix.arch }}-${{ matrix.target }}
          path: target/bern/dist/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Bern.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Bern.toml says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: erika-*
          path: dist
          merge-multiple: true

      # The store bundle (.aab) stays in the run's artifacts.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f dist/*.aab
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Erika ${GITHUB_REF_NAME#v}" \
            --generate-notes
