name: Inspect OHPM publishing secrets

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: ohpm
    steps:
      - name: Check secret bytes and local signing
        shell: bash
        env:
          OHPM_PRIVATE_KEY: ${{ secrets.OHPM_PRIVATE_KEY }}
          OHPM_KEY_PASSPHRASE: ${{ secrets.OHPM_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ohpm-debug-key.pem"
          pass_file="$RUNNER_TEMP/ohpm-debug-passphrase"
          printf '%s\n' "$OHPM_PRIVATE_KEY" > "$key_file"
          printf '%s' "$OHPM_KEY_PASSPHRASE" > "$pass_file"
          KEY_FILE="$key_file" PASS_FILE="$pass_file" node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const key = fs.readFileSync(process.env.KEY_FILE, 'utf8');
          const pass = fs.readFileSync(process.env.PASS_FILE, 'utf8');
          const sign = (candidate) => {
            try {
              const signer = crypto.createSign('RSA-SHA256');
              signer.update('v1-debug-1-2');
              signer.sign({ key, passphrase: candidate }, 'base64');
              return true;
            } catch {
              return false;
            }
          };

          console.log(JSON.stringify({
            keyBytes: Buffer.byteLength(key),
            keySha256: crypto.createHash('sha256').update(key).digest('hex'),
            keyHeader: key.split('\n').slice(0, 3).join('|'),
            passBytes: Buffer.byteLength(pass),
            passSha256: crypto.createHash('sha256').update(pass).digest('hex'),
            signRawPassphrase: sign(pass),
            signTrimmedPassphrase: sign(pass.trimEnd()),
          }));
          NODE
