[package]
name = "erika"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
build = "build.rs"

[features]
default = ["libass"]
libass = []
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
ab_glyph.workspace = true
aho-corasick.workspace = true
chardetng.workspace = true
crossbeam-channel.workspace = true
encoding_rs.workspace = true
fontdb.workspace = true
libc.workspace = true
erika_ffmpeg_sys = { path = "../erika_ffmpeg_sys" }
regex.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
soundtouch.workspace = true
thiserror.workspace = true
ureq.workspace = true
wgpu = { version = "=29.0.3", optional = true }
pollster = { version = "0.4.0", optional = true }
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }

[build-dependencies]
cc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[target.'cfg(target_os = "android")'.dependencies]
ash = "0.38.0"

[target.'cfg(target_env = "ohos")'.dependencies]
ash = "0.38.0"
glow = "0.17.0"

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics = { workspace = true, features = ["CGColorSpace"] }
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dev-dependencies]
objc2.workspace = true
objc2-metal.workspace = true
