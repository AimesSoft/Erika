[workspace]
resolver = "3"
members = ["erika-protocol", "erika-core", "erika-ui", "erika-store", "erika-catalog", "erika-dandanplay", "erika-torrent", "erika-gateway", "modules/account/protocol", "modules/account/core", "modules/danmaku/protocol", "modules/danmaku/core", "modules/danmaku/ui", "modules/enhance/protocol", "modules/enhance/core", "modules/enhance/ui", "modules/library/protocol", "modules/library/core", "modules/library/ui", "modules/anime/protocol", "modules/anime/core", "modules/anime/ui", "modules/sync/protocol", "modules/sync/core", "modules/sync/ui", "modules/sources/protocol", "modules/sources/core", "modules/sources/ui", "modules/remote/protocol", "modules/remote/core", "modules/remote/ui", "modules/downloads/protocol", "modules/downloads/core", "modules/downloads/ui"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
# All native HTTP callers inherit Windows Internet Settings as well as proxy
# environment variables. Keep this here so independently built modules do too.
ureq = { version = "3", features = ["win-system-proxy"] }
# Bern 0.1.17+, at the same immutable revision as the build tool
# (docs/dependencies.md).
bern = { git = "https://github.com/AimesSoft/Bern", rev = "bbf71ea02ed1ac9de2b876dcec9af10681c3c0eb" }
erika-protocol = { path = "erika-protocol", default-features = false }
erika-store = { path = "erika-store" }
erika-catalog = { path = "erika-catalog" }
erika-dandanplay = { path = "erika-dandanplay" }
erika-torrent = { path = "erika-torrent" }
# Remote builds use the pinned source revision; .cargo/config.toml can patch
# this to a local checkout. See docs/dependencies.md.
liberika = { package = "erika", git = "https://github.com/AimesSoft/liberika", rev = "e38a511561cb30ca57bd370b944d2e99b12737c7" }
# The playback half of the plugin interface, without native libraries.
liberika-plugin = { package = "erika_plugin", git = "https://github.com/AimesSoft/liberika", rev = "e38a511561cb30ca57bd370b944d2e99b12737c7" }
