[package]
name = "erika-sync-core"
description = "The sync module: its engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bern.workspace = true
erika-sync-protocol = { path = "../protocol" }
erika-store.workspace = true
serde_json = "1"
# The sync file's checksum, the passphrase's key and the sealed secrets.
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
flate2 = "1"

# WebDAV; the browser has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"
roxmltree = "0.20"
base64 = "0.22"
