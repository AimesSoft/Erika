# The sync module: its own protocol, engine and interface. The
# application lists it under [[modules]] in its Bern.toml.

[module]
id = "sync"
name = { "zh-Hans" = "账号同步", "en" = "Account sync" }
# Modules this one calls, reads or answers events of. The application lists
# them before this one.
depends = ["account", "anime"]
# `optional = true` lets the application switch this module off at run
# time; `enabled = false` then keeps it off until switched on.
optional = true

[module.protocol]
package = "erika-sync-protocol"
source = "protocol/src/lib.rs"

[module.engine]
package = "erika-sync-core"
type = "erika_sync_core::SyncEngine"
path = "core"

[module.ui]
package = "erika-sync-ui"
sources = "ui/src"

[languages]
supported = ["zh-Hans", "en"]
default = "zh-Hans"

[contributes]
# 「设置 › 账号同步」, in the settings of every window size: its state at
# the top, and the pages the application lists after it.
settings_sync_status = ["account_sync_status"]
settings_sync_passphrase = ["account_sync_passphrase"]
settings_sync_webdav = ["account_sync_webdav"]
settings_sync_backup = ["account_sync_backup"]
settings_sync_contents = ["account_sync_contents"]
# The automatic sync's clock and what a sync says when it is done.
background = ["sync_clock"]
