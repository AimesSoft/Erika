# The remote module: its own protocol, engine and interface. The
# application lists it under [[modules]] in its Bern.toml.

[module]
id = "remote"
name = { "zh-Hans" = "局域网与远程", "en" = "LAN and remote" }
# Modules this one calls, reads or answers events of. The application lists
# them before this one.
depends = ["library"]
# `optional = true` lets the application switch this module off at run
# time; `enabled = false` then keeps it off until switched on.
optional = true

[module.protocol]
package = "erika-remote-protocol"
source = "protocol/src/lib.rs"

[module.engine]
package = "erika-remote-core"
type = "erika_remote_core::RemoteEngine"
path = "core"

[module.ui]
package = "erika-remote-ui"
sources = "ui/src"

[languages]
supported = ["zh-Hans", "en"]
default = "zh-Hans"

[contributes]
# 「设置 › 局域网与远程」, in the settings of every window size.
settings_remote = ["remote_settings"]
# A device asking to control playback, wherever the app is.
background = ["remote_prompt"]
