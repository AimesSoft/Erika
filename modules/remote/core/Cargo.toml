[package]
name = "erika-remote-core"
description = "The remote module: its engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bern.workspace = true
erika-remote-protocol = { path = "../protocol" }
erika-store.workspace = true
serde_json = "1"

# A page has no sockets: an engine in the browser serves nothing.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha1 = "0.10"
base64 = "0.22"
gethostname = "0.5"
if-addrs = "0.13"
