# The danmaku module: its own protocol, engine and interface. The
# application lists it under [[modules]] in its Bern.toml.

[module]
id = "danmaku"
name = { "zh-Hans" = "弹幕", "en" = "Danmaku" }
# Modules this one calls, reads or answers events of. The application lists
# them before this one.
depends = []
# `optional = true` lets the application switch this module off at run
# time; `enabled = false` then keeps it off until switched on.
optional = true

[module.protocol]
package = "erika-danmaku-protocol"
source = "protocol/src/lib.rs"

[module.engine]
package = "erika-danmaku-core"
type = "erika_danmaku_core::DanmakuEngine"
path = "core"

[module.ui]
package = "erika-danmaku-ui"
sources = "ui/src"

[languages]
supported = ["zh-Hans", "en"]
default = "zh-Hans"


