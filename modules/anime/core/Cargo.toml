[package]
name = "erika-anime-core"
description = "The anime module: its engine"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bern.workspace = true
erika-anime-protocol = { path = "../protocol" }
erika-store.workspace = true
erika-dandanplay.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# bangumi-data from its CDN; the browser cannot reach it yet.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"
