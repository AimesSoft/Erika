[package]
name = "erika-anime-core"
description = "The anime module: its engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bern.workspace = true
erika-anime-protocol = { path = "../protocol" }
erika-store.workspace = true
erika-catalog.workspace = true
erika-dandanplay.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
futures-lite = "2"

# Native image decoding and account transport.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
