# The sources module: its own protocol, engine and interface. The
# application lists it under [[modules]] in its Bern.toml.

[module]
id = "sources"
name = { "zh-Hans" = "网络媒体源", "en" = "Network sources" }
# Modules this one calls, reads or answers events of. The application lists
# them before this one.
depends = ["library"]
# `optional = true` lets the application switch this module off at run
# time; `enabled = false` then keeps it off until switched on.
optional = true

[module.protocol]
package = "erika-sources-protocol"
source = "protocol/src/lib.rs"

[module.engine]
package = "erika-sources-core"
type = "erika_sources_core::SourcesEngine"
path = "core"

[module.ui]
package = "erika-sources-ui"
sources = "ui/src"

[languages]
supported = ["zh-Hans", "en"]
default = "zh-Hans"


