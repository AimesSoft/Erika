name: erika_flutter
description: Flutter embedder glue for the Erika Rust media engine.
version: 0.1.6
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.26

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.aimesoft.erika_flutter
        pluginClass: ErikaFlutterPlugin
      ios:
        pluginClass: ErikaFlutterPlugin
      tvos:
        pluginClass: ErikaFlutterPlugin
      macos:
        pluginClass: ErikaFlutterPlugin
      windows:
        pluginClass: ErikaFlutterPluginCApi
      ohos:
        pluginClass: ErikaFlutterPlugin
