[package]
name = "erika-ui"
description = "Erika: the interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["bern-module-account", "bern-module-danmaku", "bern-module-enhance", "bern-module-library", "bern-module-anime", "bern-module-sync", "bern-module-sources", "bern-module-remote", "bern-module-downloads"]
bern-module-account = ["erika-protocol/bern-module-account"]
bern-module-danmaku = ["erika-protocol/bern-module-danmaku"]
bern-module-enhance = ["erika-protocol/bern-module-enhance"]
bern-module-library = ["erika-protocol/bern-module-library"]
bern-module-anime = ["erika-protocol/bern-module-anime", "dep:erika-anime-protocol", "dep:erika-anime-ui"]
bern-module-sync = ["erika-protocol/bern-module-sync"]
bern-module-sources = ["erika-protocol/bern-module-sources"]
bern-module-remote = ["erika-protocol/bern-module-remote"]
bern-module-downloads = ["erika-protocol/bern-module-downloads", "dep:erika-downloads-protocol"]

[dependencies]
bern.workspace = true
erika-protocol.workspace = true
erika-anime-protocol = { path = "../modules/anime/protocol", optional = true }
erika-anime-ui = { path = "../modules/anime/ui", optional = true }
erika-downloads-protocol = { path = "../modules/downloads/protocol", optional = true }
