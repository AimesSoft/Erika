bern-backend-gtk = { path = "../Bern/crates/bern-backend-gtk" }
bern-backend-swiftui = { path = "../Bern/crates/bern-backend-swiftui" }
bern-backend-web = { path = "../Bern/crates/bern-backend-web" }
bern-backend-winui3 = { path = "../Bern/crates/bern-backend-winui3" }
bern-cli = { path = "../Bern/crates/bern-cli" }
