# Copy to .cargo/config.toml to develop against sibling checkouts.
# Cargo resolves these paths relative to the Erika project root.
# This example is tracked; config.toml is intentionally ignored.

[patch."https://github.com/AimesSoft/liberika"]
erika = { path = "../liberika/crates/erika" }
erika_ffmpeg_sys = { path = "../liberika/crates/erika_ffmpeg_sys" }
erika_plugin = { path = "../liberika/crates/erika_plugin" }

# liberika's Linux renderer needs the wgpu-hal it keeps in-tree (its own
# workspace patches crates.io the same way).
[patch.crates-io]
wgpu-hal = { path = "../liberika/third_party/wgpu-hal" }

# `bern build` sees Cargo take `bern` from this checkout and has the
# generated hosts take every other Bern crate from there too.
[patch."https://github.com/AimesSoft/Bern"]
bern = { path = "../Bern/crates/bern" }
# The tests run plugins in this checkout's Boa.
bern-script = { path = "../Bern/crates/bern-script" }
