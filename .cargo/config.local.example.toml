# Copy to .cargo/config.toml to develop against sibling checkouts.
# Cargo resolves these paths relative to the Erika project root.
# This example is tracked; config.toml is intentionally ignored.

[patch."https://github.com/AimesSoft/liberika"]
erika = { path = "../liberika/crates/erika" }
erika_ffmpeg_sys = { path = "../liberika/crates/erika_ffmpeg_sys" }

# Only `bern` is patched: `bern build` sees Cargo take it from this checkout
# and has the generated hosts take every other Bern crate from there too.
[patch."https://github.com/AimesSoft/Bern"]
bern = { path = "../Bern/crates/bern" }
