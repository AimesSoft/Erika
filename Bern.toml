# Erika, a Bern application. `bern run` builds it and starts it on this
# computer; `bern build --target <name>` builds one of the targets below.

[app]
id = "erika"
# Change this to a reverse-DNS name you own before you ship.
bundle_id = "com.aimessoft.erika"
version = "0.1.0"
name = { "zh-Hans" = "Erika", "en" = "Erika" }
# Shown by installers and package managers.
# publisher = "Your Name"
# The recognition gateway's posters and the thumbnails of a remote client on
# the local network come over plain http.
cleartext_http = true

# The application icon of the design (design/brand/erika-icon.html), each
# platform in its own form as `build.py` exports it: the main logo on a
# white plate (black in dark mode) where the system gives icons a shape,
# the main logo itself for anything else. macOS and iOS take the Icon
# Composer document: Liquid Glass from 26 on, flat images drawn from it
# before.
[app.icon]
default = "design/brand/erika-icon-export/logo/erika-logo-icon-1024.png"
macos = "design/brand/erika-icon-export/apple/Erika.icon"
ios = "design/brand/erika-icon-export/apple/Erika.icon"
tvos = "design/brand/erika-icon-export/tvos/Erika.brandassets"
windows = "design/brand/erika-icon-export/windows/erika.ico"
linux = "design/brand/erika-icon-export/linux/hicolor"
android = "design/brand/erika-icon-export/android/res"
browser = "design/brand/erika-icon-export/web"

# 「肤色」, the icon Settings > Appearance > App Icon switches to
# (`AppIcon::Skin`): the same logo with a skin-toned face. The television
# keeps the primary icon.
[app.alternate_icons.skin]
default = "design/brand/erika-icon-export/skin/logo/erika-logo-icon-1024.png"
macos = "design/brand/erika-icon-export/skin/apple/Erika.icon"
ios = "design/brand/erika-icon-export/skin/apple/Erika.icon"
windows = "design/brand/erika-icon-export/skin/windows/erika.ico"
linux = "design/brand/erika-icon-export/skin/linux/hicolor"
android = "design/brand/erika-icon-export/skin/android/res"
browser = "design/brand/erika-icon-export/skin/web"

[languages]
supported = ["zh-Hans", "en"]
default = "zh-Hans"

[protocol]
package = "erika-protocol"
source = "erika-protocol/src/lib.rs"

[engine]
package = "erika-core"
type = "erika_core::ErikaEngine"

[ui]
package = "erika-ui"
sources = "erika-ui/src"
root = "app"

# Breakpoints of the window sizes of the design, section 6.2.
[layouts]
compact_below = 600
medium_below = 1024
expanded_below = 1440

# The primary logo and monochrome brand mark, plus the still of the downloads'
# sample media.
[resources]
paths = ["design/assets/icon.png", "erika-ui/assets/erika-wordmark.png", "design/brand/erika-icon-export/logo/erika-logo-icon-512.png", "design/brand/erika-icon-animated.svg", "design/brand/erika-icon-export/logo/erika-logo-icon.svg", "design/brand/erika-icon-export/png/mono-black/erika-mono-black-128.png", "design/brand/erika-icon-export/svg/erika-mono-white.svg", "design/assets/still1.jpg", "design/brand/erika-icon-export/png/app-thumb/erika-app-thumb-256.png", "design/brand/erika-icon-export/skin/png/app-thumb/erika-app-thumb-256.png"]

# `channels = ["ipc"]` lets the generated command line and MCP server drive
# the running app. Remove it to ship an app that listens to nothing.

[targets.macos]
javascript = true
platform = "macos"
channels = ["ipc"]
web_ui = "web_ui"

# iOS, built for the simulator; `bern run --target ios` starts it in the
# simulator that is running.
[targets.ios]
javascript = true
platform = "ios"
channels = ["ipc"]
web_ui = "web_ui"
# One package for iOS 16 and iOS 17 and later.
frontends = ["swiftui", "swiftui-16"]

# Apple TV, built for the simulator; `bern run --target tvos` starts it in
# the Apple TV simulator that is running. The television's layouts are
# the `tv` ones of the design (6.2), driven by the remote's focus.
[targets.tvos]
javascript = true
platform = "tvos"
channels = ["ipc"]
web_ui = "web_ui"

[targets.windows]
javascript = true
platform = "windows"
channels = ["ipc"]
web_ui = "web_ui"
# WinUI 3 where Windows has a Windows App Runtime 2, the system XAML
# elsewhere. Name one front end to build only that one.
# frontends = ["winui3", "xaml-islands"]

[targets.linux]
javascript = true
platform = "linux"
channels = ["ipc"]
web_ui = "web_ui"

# Android phones; `bern run --target android` installs the app on the
# connected device and starts it.
[targets.android]
javascript = true
platform = "android"
channels = ["ipc"]
web_ui = "web_ui"
# One APK for each, in a release.
abis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
# Streams, remote access and its discovery; liberika's C++ needs the runtime.
android = { network = true, multicast = true, cxx_runtime = true }

[targets.web_app]
javascript = true
channels = ["ipc"]
# Pure Web application: UI and Rust engine both run in the browser.
# `ui` chooses the renderer; `web_mode = "app"` embeds the engine as WASM.
ui = "web"
platform = "browser"
web_mode = "app"
web_extension = { path = "web", build = ["python3", "build.py"] }

# WebUI: the browser connects to a separate native Erika engine host.
[targets.web_ui]
web_extension = { path = "web", build = ["python3", "build.py"] }
ui = "web"
platform = "browser"
web_mode = "ui"
application_transport = "websocket"
application_codec = "json"
channels = ["ipc"]

[[modules]]
path = "modules/account"

[[modules]]
path = "modules/danmaku"

[[modules]]
path = "modules/enhance"

[[modules]]
path = "modules/anime"

[[modules]]
path = "modules/library"

[[modules]]
path = "modules/sync"

[[modules]]
path = "modules/sources"

[[modules]]
path = "modules/remote"

[[modules]]
path = "modules/downloads"

[contributes]
# The phone's header row, at the top of each page's scroll, so that it
# scrolls away with the page as in the design.
page_header = ["phone_header"]
# Shared settings action inside each phone page's header control group.
phone_header_settings = ["phone_settings_button"]
# The title over the plugins page on the phone, which has no form to title.
scroll_header = ["phone_scroll_header"]
