[package]
name = "erika-torrent"
description = "Erika: BitTorrent downloads with librqbit, ported from NipaPlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = "1"

# librqbit runs where NipaPlay runs it; the browser and the television have
# no downloads.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "tvos")))'.dependencies]
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# librqbit hashes with aws-lc, which on Windows builds with NASM unless it
# takes its prebuilt objects.
[target.'cfg(windows)'.dependencies]
aws-lc-rs = { version = "1.18", default-features = false, features = ["prebuilt-nasm"] }
