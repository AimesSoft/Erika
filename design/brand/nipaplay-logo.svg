<svg xmlns="http://www.w3.org/2000/svg" viewBox="226 118 1016 404" width="1016" height="404" role="img" aria-label="NipaPlay ニパ～☆ プレ">
  <title>NipaPlay</title>
  <!--
    NipaPlay 标题字 · 手绘矢量
    - 字母与日文：沿用原 logo 的大小、位置和倾斜，重画成圆头等粗笔画
    - 播放图标：圆角三角形，上沿三条白线取自水手服领口
    - 左侧 Flutter 图形已移除
    结构：每个字形是一条中心线，同一套形状叠三层：深蓝投影 → 白色贴纸边 → 彩色笔画
  -->
  <defs>
    <!-- 字母 -->
    <path id="N" d="M298 331 L287 208 L401 322 L392 205"/>
    <path id="i1" d="M451 339 L459 297"/>
    <path id="i2" d="M454 263 L467 260"/>
    <path id="p1" d="M497 224 L508 333"/>
    <ellipse id="p2" cx="538" cy="256" rx="35" ry="39"/>
    <ellipse id="a1" cx="657" cy="257" rx="36" ry="40" transform="rotate(4 657 257)"/>
    <path id="a2" d="M702 231 L694 297"/>
    <path id="P1" d="M722 324 L737 450"/>
    <path id="P2" d="M724 322 L788 317 C826 314 830 389 791 391 L733 394"/>
    <path id="l" d="M829 470 L851 362"/>
    <ellipse id="a3" cx="921" cy="386" rx="34" ry="40" transform="rotate(-3 921 386)"/>
    <path id="a4" d="M961 352 L960 424"/>
    <path id="y1" d="M968 320 L1012 430"/>
    <path id="y2" d="M1047 307 L999 472"/>
    <!-- 日文：ニパ～☆ / プレ -->
    <path id="ni1" d="M380 406 L414 401"/>
    <path id="ni2" d="M377 444 L425 437"/>
    <path id="pa1" d="M471 396 Q467 425 450 440"/>
    <path id="pa2" d="M493 398 Q496 428 503 444"/>
    <circle id="pa3" cx="510" cy="400" r="5.5"/>
    <path id="wave" d="M544 424 C552 410 566 410 573 418 S590 428 598 415"/>
    <path id="star" d="M655.1 379.5 L659.8 403.6 L683.7 409.1 L662.2 421 L664.3 445.5 L646.4 428.8 L623.8 438.3 L634.1 416.1 L618.1 397.6 L642.4 400.5 Z"/>
    <path id="pu1" d="M778 222 L822 219 C826 238 815 258 786 270"/>
    <circle id="pu2" cx="835" cy="213" r="5.5"/>
    <path id="re" d="M867 247 L874 294 L914 266"/>
    <!-- 播放图标：三角形 A(0,-125) B(0,125) C(215,0) 外扩 18 的圆角轮廓 -->
    <path id="tri" d="M-18 -125 L-18 125 A18 18 0 0 0 9.05 140.56 L224.05 15.56 A18 18 0 0 0 224.05 -15.56 L9.05 -140.56 A18 18 0 0 0 -18 -125 Z"/>
    <clipPath id="triClip"><use href="#tri"/></clipPath>

    <!-- 贴纸底：同一组形状，颜色由 color 决定（投影 / 白边各用一次） -->
    <g id="sticker" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <use href="#tri" transform="translate(1046 270) rotate(-24) translate(-72 0)" fill="currentColor" stroke-width="44"/>
      <use href="#N" stroke-width="80"/>
      <use href="#i1" stroke-width="74"/><use href="#i2" stroke-width="64"/>
      <use href="#p1" stroke-width="74"/><use href="#p2" fill="currentColor" stroke-width="70"/>
      <use href="#a1" fill="currentColor" stroke-width="70"/><use href="#a2" stroke-width="74"/>
      <use href="#P1" stroke-width="78"/><use href="#P2" stroke-width="74"/>
      <use href="#l" stroke-width="74"/>
      <use href="#a3" fill="currentColor" stroke-width="70"/><use href="#a4" stroke-width="74"/>
      <use href="#y1" stroke-width="74"/><use href="#y2" stroke-width="74"/>
      <g stroke-width="58">
        <use href="#ni1"/><use href="#ni2"/><use href="#pa1"/><use href="#pa2"/><use href="#pa3"/>
        <use href="#wave"/><use href="#pu1"/><use href="#pu2"/><use href="#re"/>
      </g>
      <use href="#star" fill="currentColor" stroke-width="50"/>
    </g>
  </defs>

  <!-- ① 投影  ② 白色贴纸边 -->
  <use href="#sticker" color="#0B4F9E" transform="translate(12 15)"/>
  <use href="#sticker" color="#FFFFFF"/>

  <!-- ③ 播放图标 · 水手领 -->
  <g transform="translate(1046 270) rotate(-24) translate(-72 0)">
    <use href="#tri" fill="#8B5CFF"/>
    <rect x="-40" y="-170" width="300" height="170" fill="#A98CFF" clip-path="url(#triClip)"/>
    <!-- 三条白线沿左边和上沿绕过左上角，像水手领的滚边 -->
    <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 60 L8 -111.1 L150 -28.5"/>
      <path d="M18 48 L18 -93.7 L135 -25.4"/>
      <path d="M28 36 L28 -76.3 L120 -22.8"/>
    </g>
  </g>

  <!-- 压在图标上的字母补一道白边 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="74">
    <use href="#y1"/><use href="#y2"/><use href="#a4"/><use href="#re" stroke-width="58"/>
  </g>

  <!-- ④ 彩色笔画 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#N" stroke="#FF5A7E" stroke-width="36"/>
    <use href="#i1" stroke="#FFBE3D" stroke-width="30"/><use href="#i2" stroke="#FFBE3D" stroke-width="20"/>
    <use href="#p2" stroke="#FF6A48" stroke-width="26"/>
    <use href="#p1" stroke="#FFBE3D" stroke-width="30"/>
    <use href="#a1" stroke="#4D6BFF" stroke-width="26"/><use href="#a2" stroke="#4D6BFF" stroke-width="30"/>
    <use href="#P2" stroke="#E8507A" stroke-width="30"/>
    <use href="#P1" stroke="#FF8A3D" stroke-width="34"/>
    <use href="#l" stroke="#E04FC0" stroke-width="30"/>
    <use href="#a3" stroke="#F065CE" stroke-width="26"/><use href="#a4" stroke="#9467FF" stroke-width="30"/>
    <use href="#y1" stroke="#F065CE" stroke-width="30"/>
    <use href="#y2" stroke="#8B5CFF" stroke-width="30"/>
    <g stroke-width="14">
      <use href="#ni1" stroke="#E0558A"/><use href="#ni2" stroke="#A93C93"/>
      <use href="#pa1" stroke="#4D6BFF"/><use href="#pa2" stroke="#1E4FA3"/>
      <use href="#pa3" stroke="#12596B" stroke-width="4.5"/>
      <use href="#wave" stroke="#E0558A"/>
      <use href="#pu1" stroke="#2E6C86"/><use href="#pu2" stroke="#2E6C86" stroke-width="4.5"/>
      <use href="#re" stroke="#8E3457"/>
    </g>
    <use href="#star" fill="#2FB8F5" stroke="#2FB8F5" stroke-width="6"/>
  </g>

  <!-- ⑤ 高光 -->
  <g fill="#FFFFFF" fill-opacity=".92">
    <circle cx="288" cy="214" r="6"/>
    <circle cx="455" cy="304" r="4.5"/>
    <circle cx="534" cy="222" r="5.5"/>
    <circle cx="631" cy="230" r="7"/><circle cx="621" cy="246" r="4"/>
    <circle cx="726" cy="331" r="5.5"/>
    <circle cx="849" cy="369" r="5"/>
    <circle cx="891" cy="368" r="5.5"/><circle cx="900" cy="356" r="3.2"/>
    <circle cx="970" cy="324" r="5"/>
  </g>
</svg>
