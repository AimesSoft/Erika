<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1056 1056" width="1024" height="1024" role="img" aria-label="Erika"><title>Erika</title><!--
  Erika 图标 · 出场动画（纯 CSS，放进 <img> 和 GitHub README 都会播放；系统开了「减少动态效果」就直接显示）：
    0.00s 头发的圆弹出来（果冻回弹）
    0.30s 猫脸从底下蹦上来，落地压扁再弹回
    0.75s 两只眼睛先后弹开 · 0.95s「^」嘴冒出来
    1.00s 米黄竖发绳从上往下展开 · 1.05s 品红蝴蝶结圈绕顶点像钟摆一样晃几下
    1.15s 帽子转着掉下来，落在耳朵上压扁、回弹、摆正
    1.55s 帽子周围闪三颗圆角小星星，淡出
    2.05s 眨一下眼；全程约 2.3s，停在最后一帧（和静态 logo 一样）
  双击随机做一个小动作（要直接打开或用 <object> 嵌入，<img> 里不运行脚本）：
    wink   左眼眨成弧线、甩出一颗小星星，歪头（1.5s）
    摸头   像猫一样被按住左右蹭，眼睛眯成「︶」，嘴变「ω」，脸红，冒小心心（2.6s）
    坏笑   古户绘梨花的招牌表情：眼皮压成斜的半眯眼，皱一边眉毛，嘴角一歪，抬下巴，帽子闪一下（2.8s）
--><style>
    .hair, .face, .eye, .blink, .mouth, .tail, .loop, .hat, .spark { transform-box: fill-box; animation-fill-mode: both; animation-timing-function: cubic-bezier(.3, .7, .4, 1); }
    .hair  { transform-origin: 50% 50%;  animation-name: pop;    animation-duration: .55s; }
    .face  { transform-origin: 50% 83.68%; animation-name: hop;    animation-duration: .7s;  animation-delay: .3s; }
    .eye   { transform-origin: 50% 100%; animation-name: eye;    animation-duration: .42s; }
    .eye.l { animation-delay: .75s; } .eye.r { animation-delay: .83s; }
    .blink { transform-origin: 50% 35%;  animation-name: blink;  animation-duration: .24s; animation-delay: 2.05s; animation-timing-function: ease-in-out; }
    .mouth { transform-origin: 50% 50%;  animation-name: pop2;    animation-duration: .4s;  animation-delay: .95s; }
    .tail  { transform-origin: 50% 0;    animation-name: unroll; animation-duration: .45s; animation-delay: 1.0s; }
    .loop  { transform-origin: 0 0;      animation-name: swing;  animation-duration: .95s; animation-delay: 1.05s; animation-timing-function: ease-in-out; }
    .hat   { transform-origin: 50% 100%; animation-name: hat;    animation-duration: .8s;  animation-delay: 1.15s; }
    .spark { transform-origin: 50% 50%;  animation-name: twinkle; animation-duration: .85s; }
    .s1 { animation-delay: 1.55s; } .s2 { animation-delay: 1.65s; } .s3 { animation-delay: 1.75s; }
    @keyframes pop     { 0% { transform: scale(0); } 55% { transform: scale(1.03); } 76% { transform: scale(.96); } 90% { transform: scale(1.01); } 100% { transform: none; } }
    @keyframes pop2    { 0% { transform: scale(0); } 55% { transform: scale(1.25); } 76% { transform: scale(.9); } 90% { transform: scale(1.04); } 100% { transform: none; } }
    @keyframes hop     { 0% { transform: translateY(1000px); } 55% { transform: translateY(-34px) scale(.96, 1.05); } 72% { transform: translateY(0) scale(1.06, .94); } 87% { transform: translateY(-6px) scale(.99, 1.01); } 100% { transform: none; } }
    @keyframes eye     { 0% { transform: scaleY(0); } 60% { transform: scaleY(1.18); } 82% { transform: scaleY(.94); } 100% { transform: none; } }
    @keyframes blink   { 0%, 100% { transform: none; } 45%, 55% { transform: scaleY(.08); } }
    @keyframes unroll  { 0% { transform: scaleY(0); } 70% { transform: scaleY(1.06); } 100% { transform: none; } }
    @keyframes swing   { 0% { transform: rotate(38deg); opacity: 0; } 12% { opacity: 1; } 40% { transform: rotate(-8deg); } 62% { transform: rotate(4deg); } 80% { transform: rotate(-1.5deg); } 100% { transform: none; opacity: 1; } }
    @keyframes hat     { 0% { transform: translateY(-470px) rotate(-38deg); opacity: 0; } 12% { opacity: 1; } 55% { transform: translateY(14px) rotate(9deg) scale(1.08, .9); } 72% { transform: translateY(-2px) rotate(-5deg) scale(.98, 1.02); } 88% { transform: translateY(2px) rotate(2deg); } 100% { transform: none; opacity: 1; } }
    @keyframes twinkle { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 35% { transform: scale(1.15) rotate(10deg); opacity: 1; } 70% { transform: scale(.9); opacity: 1; } 100% { transform: scale(0) rotate(20deg); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .hair, .face, .eye, .blink, .mouth, .tail, .loop, .hat, .spark { animation: none; } .spark { opacity: 0; } }

    /* ---- 双击的随机小动作：根元素加上 do-wink / do-pet / do-smug，动画放完由脚本去掉 ---- */
    svg { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
    .rx, .r-eL, .r-eR, .r-m, .x { transform-box: fill-box; transform-origin: 50% 50%; }
    /* 两个 .rx 组里各垫了一个同样大的透明框，百分比原点在两组里指向同一个点。帽子顶离画框只有 8，所以歪头都绕帽子正下方的点转，帽子只左右动、不往上冒 */
    .rx { transform-origin: 50% 80.29%; }                       /* 摸头：圆的最低点 (512, 1024) */
    .do-wink .rx { transform-origin: 78.02% 80.29%; }          /* wink：帽子正下方的地面 (855, 1024) */
    .do-smug .rx { transform-origin: 78.02% 42.86%; }             /* 坏笑：帽子正下方 (855, 500) */
    .r-eL, .r-eR { transform-origin: 50% 75%; }        /* 眼睛往下合上 */

    /* wink：左眼眨成弧线、甩出一颗小星星，歪头 */
    .do-wink .rx    { animation: wk-head 1.5s cubic-bezier(.3, .7, .4, 1) both; }
    .do-wink .r-eL  { animation: wk-shut 1.5s cubic-bezier(.3, .7, .4, 1) both; }
    .do-wink .winkL { animation: wk-arch 1.5s cubic-bezier(.3, .7, .4, 1) both; }
    .do-wink .r-m   { animation: wk-mouth 1.5s cubic-bezier(.3, .7, .4, 1) both; }
    .do-wink .wstar { animation: wk-star 1.5s cubic-bezier(.3, .7, .4, 1) both; }
    @keyframes wk-head  { 0% { transform: rotate(0); } 16% { transform: rotate(-8deg); } 28%, 78% { transform: rotate(-6deg); } 90% { transform: rotate(1.5deg); } 100% { transform: rotate(0); } }
    @keyframes wk-shut  { 0% { transform: scaleY(1); } 10%, 80% { transform: scaleY(0); } 90% { transform: scaleY(1.08); } 100% { transform: scaleY(1); } }
    @keyframes wk-arch  { 0%, 8% { opacity: 0; transform: scale(.3); } 18% { opacity: 1; transform: scale(1.15); } 28%, 80% { opacity: 1; transform: scale(1); } 84%, 100% { opacity: 0; transform: scale(.6); } }
    @keyframes wk-mouth { 0% { transform: scale(1); } 12% { transform: scale(1.25); } 24% { transform: scale(.92); } 34%, 100% { transform: scale(1); } }
    @keyframes wk-star  { 0%, 12% { opacity: 0; transform: translate(0, 0) rotate(0) scale(0); } 30% { opacity: 1; transform: translate(-50px, -55px) rotate(80deg) scale(1.15); } 55% { opacity: 1; transform: translate(-85px, -95px) rotate(150deg) scale(.9); } 72%, 100% { opacity: 0; transform: translate(-100px, -112px) rotate(200deg) scale(0); } }

    /* 摸头：像猫一样被按住、左右蹭，眼睛眯成「︶」，嘴变「ω」，脸红，冒小心心 */
    .do-pet .rx     { animation: pt-head 2.6s cubic-bezier(.3, .7, .4, 1) both; }
    .do-pet .r-eL, .do-pet .r-eR { animation: pt-shut 2.6s cubic-bezier(.3, .7, .4, 1) both; }
    .do-pet .calm   { animation: pt-calm 2.6s cubic-bezier(.3, .7, .4, 1) both; }
    .do-pet .r-m    { animation: pt-mouth 2.6s cubic-bezier(.3, .7, .4, 1) both; }
    .do-pet .omega  { animation: pt-omega 2.6s cubic-bezier(.3, .7, .4, 1) both; }
    .do-pet .blush  { animation: pt-blush 2.6s cubic-bezier(.3, .7, .4, 1) both; }
    .do-pet .h1     { animation: pt-heart1 2.6s cubic-bezier(.3, .7, .4, 1) both; }
    .do-pet .h2     { animation: pt-heart2 2.6s cubic-bezier(.3, .7, .4, 1) both; }
    @keyframes pt-head   { 0% { transform: rotate(0) scale(1, 1); } 8% { transform: rotate(0) scale(1.03, .92); } 20% { transform: rotate(2deg) scale(1.03, .94); } 33% { transform: rotate(-2deg) scale(1.03, .93); } 46% { transform: rotate(2deg) scale(1.03, .94); } 59% { transform: rotate(-2deg) scale(1.03, .93); } 72% { transform: rotate(1deg) scale(1.02, .95); } 84% { transform: rotate(0) scale(.99, 1.006); } 92% { transform: rotate(0) scale(1.005, .997); } 100% { transform: rotate(0) scale(1, 1); } }
    @keyframes pt-shut   { 0% { transform: scaleY(1); } 7%, 84% { transform: scaleY(0); } 92% { transform: scaleY(1.08); } 100% { transform: scaleY(1); } }
    @keyframes pt-calm   { 0%, 6% { opacity: 0; transform: scale(.4); } 14% { opacity: 1; transform: scale(1.12); } 22%, 84% { opacity: 1; transform: scale(1); } 88%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes pt-mouth  { 0% { transform: scale(1); } 7%, 84% { transform: scale(0); } 94% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes pt-omega  { 0%, 8% { opacity: 0; transform: scale(.3); } 16% { opacity: 1; transform: scale(1.15); } 24%, 84% { opacity: 1; transform: scale(1); } 88%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes pt-blush  { 0%, 10% { opacity: 0; transform: scale(.5); } 22% { opacity: 1; transform: scale(1.06); } 30%, 82% { opacity: 1; transform: scale(1); } 90%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes pt-heart1 { 0%, 18% { opacity: 0; transform: translate(0, 0) scale(.2); } 30% { opacity: 1; transform: translate(-6px, -30px) scale(1.1); } 50% { opacity: 1; transform: translate(-18px, -80px) scale(1); } 70%, 100% { opacity: 0; transform: translate(-26px, -140px) scale(.7); } }
    @keyframes pt-heart2 { 0%, 36% { opacity: 0; transform: translate(0, 0) scale(.2); } 48% { opacity: 1; transform: translate(6px, -30px) scale(1.1); } 66% { opacity: 1; transform: translate(18px, -80px) scale(1); } 84%, 100% { opacity: 0; transform: translate(26px, -140px) scale(.7); } }

    /* 绘梨花的招牌表情：眼皮压下来变成斜着的半眯眼，一边眉毛皱起，嘴角一歪坏笑，抬下巴，帽子闪一下 */
    .do-smug .rx    { animation: sm-head 2.8s cubic-bezier(.3, .7, .4, 1) both; }
    .do-smug .lid   { animation: sm-lid 2.8s cubic-bezier(.3, .7, .4, 1) both; }
    .do-smug .brow  { animation: sm-brow 2.8s cubic-bezier(.3, .7, .4, 1) both; }
    .do-smug .r-m   { animation: sm-mouth 2.8s cubic-bezier(.3, .7, .4, 1) both; }
    .do-smug .smirk { animation: sm-smirk 2.8s cubic-bezier(.3, .7, .4, 1) both; }
    .do-smug .glint { animation: sm-glint 2.8s cubic-bezier(.3, .7, .4, 1) both; }
    @keyframes sm-head  { 0% { transform: rotate(0); } 12% { transform: rotate(5deg); } 22%, 84% { transform: rotate(3deg); } 93% { transform: rotate(-1deg); } 100% { transform: rotate(0); } }
    @keyframes sm-lid   { 0%, 10% { opacity: 1; transform: translateY(-140px); } 20% { opacity: 1; transform: translateY(6px); } 27%, 82% { opacity: 1; transform: translateY(0); } 94%, 100% { opacity: 1; transform: translateY(-140px); } }
    @keyframes sm-brow  { 0%, 14% { opacity: 0; transform: translateY(-16px); } 24% { opacity: 1; transform: translateY(2px); } 30%, 84% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes sm-mouth { 0% { transform: scale(1); } 10%, 86% { transform: scale(0); } 95% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes sm-smirk { 0%, 10% { opacity: 0; transform: scale(.3); } 20% { opacity: 1; transform: scale(1.1); } 28%, 86% { opacity: 1; transform: scale(1); } 90%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes sm-glint { 0%, 28% { opacity: 0; transform: rotate(0) scale(0); } 38% { opacity: 1; transform: rotate(60deg) scale(1.25); } 50% { opacity: 1; transform: rotate(100deg) scale(.9); } 62%, 100% { opacity: 0; transform: rotate(140deg) scale(0); } }
    @media (prefers-reduced-motion: reduce) { .rx { animation: none !important; } }
</style><defs><clipPath id="ec"><circle cx="512" cy="512" r="512"/></clipPath><clipPath id="cll"><rect x="300.5" y="422" width="111" height="228"/></clipPath><clipPath id="clr"><rect x="612.5" y="422" width="111" height="228"/></clipPath></defs><g class="hair"><path d="M-512 0A512 512 0 1 0 512 0A512 512 0 1 0 -512 0Z" fill="#3E5BD8" transform="translate(512 512) rotate(0)"/></g><g clip-path="url(#ec)"><g class="rx"><rect x="-100" y="-100" width="1224" height="1400" fill="none"/><g class="face"><path d="M332.7 344L691.3 344C719.74 344 739.28 321.03 734.74 292.97L714.19 166.12C708.04 128.11 731.23 111 765.73 128.12C844.39 167.14 961.58 757.5 853.85 1032L787.92 1200L236.08 1200L170.15 1032C62.42 757.5 179.61 167.14 258.27 128.12C292.77 111 315.96 128.11 309.81 166.12L289.26 292.97C284.72 321.03 304.26 344 332.7 344Z" fill="#222B4F"/></g></g></g><g class="rx"><rect x="-100" y="-100" width="1224" height="1400" fill="none"/><g class="tail"><path d="M0 -258.5L0 -258.5A13 13 0 0 1 13 -245.5L13 245.5A13 13 0 0 1 0 258.5L0 258.5A13 13 0 0 1 -13 245.5L-13 -245.5A13 13 0 0 1 0 -258.5Z" fill="#F3E1A9" transform="translate(829 462.5) rotate(0)"/></g><g class="loop"><path d="M-64.28 -193.97L63.12 111.39C65.1 116.14 64.47 123.59 61.72 127.94L29.28 179.26C15.39 201.24 0.55 198.24 -3.69 172.58L-64.28 -193.97Z" fill="none" stroke="#D340AD" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(893.28 410.97) rotate(0) scale(1 1)"/></g><g class="eye l"><g class="blink"><g class="r-eL"><path d="M-49.5 -108H49.5V58.5A49.5 49.5 0 0 1 -49.5 58.5Z" fill="#DCE6FF" transform="translate(356 536) rotate(0) scale(1 1)"/></g><g clip-path="url(#cll)"><g class="x lid" opacity="0"><path fill="#222B4F" d="M300 420L412 420L412 548L300 514Z"/></g></g></g></g><g class="eye r"><g class="blink"><g class="r-eR"><path d="M-49.5 -108H49.5V58.5A49.5 49.5 0 0 1 -49.5 58.5Z" fill="#DCE6FF" transform="translate(668 536) rotate(0) scale(1 1)"/></g><g clip-path="url(#clr)"><g class="x lid" opacity="0"><path fill="#222B4F" d="M612 420L724 420L724 506L612 534Z"/></g></g></g></g><g class="x winkL" opacity="0"><path d="M-50 20Q0 -48 50 20" fill="none" stroke="#DCE6FF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(356 588)"/></g><g class="x calm" opacity="0"><path d="M-46 -14Q0 40 46 -14" fill="none" stroke="#DCE6FF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(356 575)"/></g><g class="x calm" opacity="0"><path d="M-46 -14Q0 40 46 -14" fill="none" stroke="#DCE6FF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(668 575)"/></g><g class="x brow" opacity="0"><path d="M-50 -14L50 14" fill="none" stroke="#DCE6FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" transform="translate(352 390)"/><path d="M-50 6L50 -6" fill="none" stroke="#DCE6FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" transform="translate(670 392)"/></g><g class="x blush" opacity="0"><ellipse cx="326" cy="680" rx="42" ry="19" fill="#FF2E55"/></g><g class="x blush" opacity="0"><ellipse cx="698" cy="680" rx="42" ry="19" fill="#FF2E55"/></g><g class="mouth"><g class="r-m"><path d="M-48.5 24L0 -24L48.5 24" fill="none" stroke="#DCE6FF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" transform="translate(512 716) rotate(0) scale(1 1)"/></g></g><g class="x omega" opacity="0"><path d="M-50 -8Q-48 18 -25 18Q-2 18 0 -4Q2 18 25 18Q48 18 50 -8" fill="none" stroke="#DCE6FF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" transform="translate(512 712)"/></g><g class="x smirk" opacity="0"><path d="M-84 -14Q-14 34 86 -28" fill="none" stroke="#DCE6FF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" transform="translate(512 712)"/></g><g class="hat"><path d="M12 -154.04L127.4 -87.41A24 24 0 0 1 139.4 -66.63L139.4 66.63A24 24 0 0 1 127.4 87.41L12 154.04A24 24 0 0 1 -12 154.04L-127.4 87.41A24 24 0 0 1 -139.4 66.63L-139.4 -66.63A24 24 0 0 1 -127.4 -87.41L-12 -154.04A24 24 0 0 1 12 -154.04Z" fill="#FF2E55" transform="translate(855.06 149.74) rotate(0)"/></g><g class="x wstar" opacity="0"><path fill="#F3E1A9" stroke="#F3E1A9" stroke-width="0.34" stroke-linejoin="round" transform="translate(300 452) scale(34)" d="M0 -.8C.16 -.16 .16 -.16 .8 0C.16 .16 .16 .16 0 .8C-.16 .16 -.16 .16 -.8 0C-.16 -.16 -.16 -.16 0 -.8Z"/></g><g class="x glint" opacity="0"><path fill="#F3E1A9" stroke="#F3E1A9" stroke-width="0.34" stroke-linejoin="round" transform="translate(720 74) scale(46)" d="M0 -.8C.16 -.16 .16 -.16 .8 0C.16 .16 .16 .16 0 .8C-.16 .16 -.16 .16 -.8 0C-.16 -.16 -.16 -.16 0 -.8Z"/></g><g class="x h1" opacity="0"><path fill="#FF2E55" stroke="#FF2E55" stroke-width="0.2" stroke-linejoin="round" transform="translate(430 286) scale(30)" d="M0 .78C-.5 .42 -.92 .08 -.92 -.32C-.92 -.68 -.64 -.9 -.34 -.9C-.16 -.9 -.04 -.8 0 -.66C.04 -.8 .16 -.9 .34 -.9C.64 -.9 .92 -.68 .92 -.32C.92 .08 .5 .42 0 .78Z"/></g><g class="x h2" opacity="0"><path fill="#FF2E55" stroke="#FF2E55" stroke-width="0.2" stroke-linejoin="round" transform="translate(594 276) scale(24)" d="M0 .78C-.5 .42 -.92 .08 -.92 -.32C-.92 -.68 -.64 -.9 -.34 -.9C-.16 -.9 -.04 -.8 0 -.66C.04 -.8 .16 -.9 .34 -.9C.64 -.9 .92 -.68 .92 -.32C.92 .08 .5 .42 0 .78Z"/></g></g><g class="spark s1"><path fill="#F3E1A9" stroke="#F3E1A9" stroke-width="0.34" stroke-linejoin="round" transform="translate(686 76) scale(54)" d="M0 -.8C.16 -.16 .16 -.16 .8 0C.16 .16 .16 .16 0 .8C-.16 .16 -.16 .16 -.8 0C-.16 -.16 -.16 -.16 0 -.8Z"/></g><g class="spark s2"><path fill="#FF2E55" stroke="#FF2E55" stroke-width="0.34" stroke-linejoin="round" transform="translate(984 352) scale(42)" d="M0 -.8C.16 -.16 .16 -.16 .8 0C.16 .16 .16 .16 0 .8C-.16 .16 -.16 .16 -.8 0C-.16 -.16 -.16 -.16 0 -.8Z"/></g><g class="spark s3"><path fill="#D340AD" stroke="#D340AD" stroke-width="0.34" stroke-linejoin="round" transform="translate(970 36) scale(32)" d="M0 -.8C.16 -.16 .16 -.16 .8 0C.16 .16 .16 .16 0 .8C-.16 .16 -.16 .16 -.8 0C-.16 -.16 -.16 -.16 0 -.8Z"/></g><script><![CDATA[
(function () {
  // 双击随机做一个小动作（连续两次不重复）。只在 SVG 自己是文档时生效：直接打开、<object>、<embed>；放进 <img> 时脚本不运行
  var me = document.currentScript, svg = (me && me.ownerSVGElement) || document.documentElement;
  var acts = { wink: 1500, pet: 2600, smug: 2800 }, names = Object.keys(acts), last = '', timer = 0;
  if (svg === document.documentElement) { svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%'); }
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ready = Date.now() + (calm ? 0 : 2300);   // 出场动画放完再接受双击
  svg.addEventListener('dblclick', function (e) {
    e.preventDefault();
    if (Date.now() < ready) return;
    var pool = names.filter(function (n) { return n !== last; });
    var a = pool[Math.floor(Math.random() * pool.length)];
    last = a;
    names.forEach(function (n) { svg.classList.remove('do-' + n); });
    svg.getBoundingClientRect();   // 强制重算样式，动画才会从头播
    svg.classList.add('do-' + a);
    clearTimeout(timer);
    timer = setTimeout(function () { svg.classList.remove('do-' + a); }, acts[a]);
  });
})();
]]></script></svg>
