    </mask>
  </defs>
  <rect class="bg" width="1024" height="1024" fill="#F3ECDF"/>
  <path class="m" mask="url(#khm)" d="M440.5 541.9 A150 150 0 1 1 583.5 541.9 L619.8 746.5 A20 20 0 0 1 600.1 770 L423.9 770 A20 20 0 0 1 404.2 746.5 Z" fill="#213A6B"/>
  <path class="a" d="M482.8 349 L482.8 471 L588.4 410 Z" fill="#DC2A5A" stroke="#DC2A5A" stroke-width="28" stroke-linejoin="round"/>
</svg>
