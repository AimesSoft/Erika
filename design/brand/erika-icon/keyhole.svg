<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Erika 图标 · 钥匙孔">
  <title>Erika · B 钥匙孔</title>
  <!--
    B 钥匙孔：圆头 (512, 410) 半径 150，下面是往下张开的槽（上宽 128、下宽 224，底角圆角 20），底边 y = 770。
