<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Erika 图标 · 红与蓝的真实">
  <title>Erika · C 红与蓝的真实</title>
  <!--
    C 红与蓝的真实：一个播放三角（左边 x = 352、尖端 x = 762、上 275、下 749）沿中线切成上下两块，
