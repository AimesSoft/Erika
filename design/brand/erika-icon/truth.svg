  -->
  <rect class="bg" width="1024" height="1024" fill="#F3ECDF"/>
  <path class="a" d="M364 295.8 L700 490 L364 490 Z" fill="#DC2A5A" stroke="#DC2A5A" stroke-width="24" stroke-linejoin="round"/>
  <path class="m" d="M364 728.2 L700 534 L364 534 Z" fill="#213A6B" stroke="#213A6B" stroke-width="24" stroke-linejoin="round"/>
</svg>
