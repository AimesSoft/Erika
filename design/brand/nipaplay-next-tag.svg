<svg xmlns="http://www.w3.org/2000/svg" viewBox="226 118 1030 404" width="1030" height="404" role="img" aria-label="NipaPlay Next ニパ～☆ プレ">
  <title>NipaPlay Next</title>
  <!--
    NipaPlay 标题字 · 手绘矢量
    - 字母与日文：沿用原 logo 的大小、位置和倾斜，重画成圆头等粗笔画
    - 播放图标：更尖的圆角三角形，倾斜 12°，图案见 _build_icons.py 的方案
    - 左侧 Flutter 图形已移除
    结构：每个字形是一条中心线，同一套形状叠三层：深蓝投影 → 白色贴纸边 → 彩色笔画
  -->
  <defs>
    <!-- 字母 -->
    <path id="N" d="M298 331 L287 208 L401 322 L392 205"/>
    <path id="i1" d="M451 339 L459 297"/>
    <path id="i2" d="M454 263 L467 260"/>
    <path id="p1" d="M497 224 L508 333"/>
    <ellipse id="p2" cx="538" cy="256" rx="35" ry="39"/>
    <ellipse id="a1" cx="657" cy="257" rx="36" ry="40" transform="rotate(4 657 257)"/>
    <path id="a2" d="M702 231 L694 297"/>
    <path id="P1" d="M722 324 L737 450"/>
    <path id="P2" d="M724 322 L788 317 C826 314 830 389 791 391 L733 394"/>
    <path id="l" d="M829 470 L851 362"/>
    <ellipse id="a3" cx="921" cy="386" rx="34" ry="40" transform="rotate(-3 921 386)"/>
    <path id="a4" d="M961 352 L960 424"/>
    <path id="y1" d="M968 320 L1012 430"/>
    <path id="y2" d="M1047 307 L999 472"/>
    <!-- 日文：ニパ～☆ / プレ -->
    <path id="ni1" d="M380 406 L414 401"/>
    <path id="ni2" d="M377 444 L425 437"/>
    <path id="pa1" d="M471 396 Q467 425 450 440"/>
    <path id="pa2" d="M493 398 Q496 428 503 444"/>
    <circle id="pa3" cx="510" cy="400" r="5.5"/>
    <path id="wave" d="M544 424 C552 410 566 410 573 418 S590 428 598 415"/>
    <path id="star" d="M655.1 379.5 L659.8 403.6 L683.7 409.1 L662.2 421 L664.3 445.5 L646.4 428.8 L623.8 438.3 L634.1 416.1 L618.1 397.6 L642.4 400.5 Z"/>
    <path id="pu1" d="M778 222 L822 219 C826 238 815 258 786 270"/>
    <circle id="pu2" cx="835" cy="213" r="5.5"/>
    <path id="re" d="M867 247 L874 294 L914 266"/>
    <!-- 播放图标：三角形 A(0,-118) B(0,118) C(215,0) 外扩 18 的圆角轮廓 -->
    <path id="tri" d="M-18 -118 L-18 118 A18 18 0 0 0 8.66 133.78 L223.66 15.78 A18 18 0 0 0 223.66 -15.78 L8.66 -133.78 A18 18 0 0 0 -18 -118 Z"/>
    <clipPath id="triClip"><use href="#tri"/></clipPath>

    <!-- 贴纸底：同一组形状，颜色由 color 决定（投影 / 白边各用一次） -->
    <g id="sticker" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <use href="#tri" transform="translate(1046 270) rotate(-12) translate(-72 0)" fill="currentColor" stroke-width="44"/>
      <use href="#N" stroke-width="80"/>
      <use href="#i1" stroke-width="74"/><use href="#i2" stroke-width="64"/>
      <use href="#p1" stroke-width="74"/><use href="#p2" fill="currentColor" stroke-width="70"/>
      <use href="#a1" fill="currentColor" stroke-width="70"/><use href="#a2" stroke-width="74"/>
      <use href="#P1" stroke-width="78"/><use href="#P2" stroke-width="74"/>
      <use href="#l" stroke-width="74"/>
      <use href="#a3" fill="currentColor" stroke-width="70"/><use href="#a4" stroke-width="74"/>
      <use href="#y1" stroke-width="74"/><use href="#y2" stroke-width="74"/>
      <g stroke-width="58">
        <use href="#ni1"/><use href="#ni2"/><use href="#pa1"/><use href="#pa2"/><use href="#pa3"/>
        <use href="#wave"/><use href="#pu1"/><use href="#pu2"/><use href="#re"/>
      </g>
      <use href="#star" fill="currentColor" stroke-width="50"/>
    </g>
    <g id="next-glyphs">
      <rect x="13" y="11" width="6.5" height="30"/><rect x="31.5" y="11" width="6.5" height="30"/><path d="M13 11 L21.46 11 L38 41 L29.54 41 Z"/>
      <rect x="47" y="11" width="6.5" height="30"/><rect x="47" y="11" width="19" height="6.5"/><rect x="47" y="22.75" width="17" height="6.5"/><rect x="47" y="34.5" width="19" height="6.5"/>
      <path d="M75 11 L83.46 11 L100 41 L91.54 41 Z"/><path d="M91.54 11 L100 11 L83.46 41 L75 41 Z"/>
      <rect x="109" y="11" width="23" height="6.5"/><rect x="117.25" y="11" width="6.5" height="30"/>
    </g>
  </defs>

  <!-- ① 投影  ② 白色贴纸边 -->
  <use href="#sticker" color="#7DB4F2" transform="translate(12 15)"/>
  <use href="#sticker" color="#FFFFFF"/>

  <!-- ③ 播放图标 · 星星 -->
  <g transform="translate(1046 270) rotate(-12) translate(-72 0)">
    <use href="#tri" fill="#8E7FFF"/>
    <rect x="-40" y="-170" width="300" height="170" fill="#ACA0FF" clip-path="url(#triClip)"/>
    <path d="M128.7 -52.9 L131.9 -28 L155.9 -20.5 L133.1 -9.8 L133.5 15.4 L116.3 -3 L92.4 5.1 L104.5 -16.9 L89.5 -37.1 L114.2 -32.4 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- 压在图标上的字母补一道白边 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="74">
    <use href="#y1"/><use href="#y2"/><use href="#a4"/><use href="#re" stroke-width="58"/>
  </g>

  <!-- ④ 彩色笔画 · 樱粉 / 柠檬黄 / 薄荷绿 / 天空蓝 四色轮换 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#N" stroke="#FF7FA8" stroke-width="36"/>
    <use href="#i1" stroke="#FFB938" stroke-width="30"/><use href="#i2" stroke="#FFB938" stroke-width="20"/>
    <use href="#p2" stroke="#2FCB9E" stroke-width="26"/><use href="#p1" stroke="#2FCB9E" stroke-width="30"/>
    <use href="#a1" stroke="#3CB8F4" stroke-width="26"/><use href="#a2" stroke="#3CB8F4" stroke-width="30"/>
    <use href="#P2" stroke="#FF7FA8" stroke-width="30"/><use href="#P1" stroke="#FF7FA8" stroke-width="34"/>
    <use href="#l" stroke="#FFB938" stroke-width="30"/>
    <use href="#a3" stroke="#2FCB9E" stroke-width="26"/><use href="#a4" stroke="#2FCB9E" stroke-width="30"/>
    <use href="#y1" stroke="#3CB8F4" stroke-width="30"/><use href="#y2" stroke="#3CB8F4" stroke-width="30"/>
    <!-- 日文统一一个颜色，安静一些 -->
    <g stroke="#4A90E2" stroke-width="14">
      <use href="#ni1"/><use href="#ni2"/><use href="#pa1"/><use href="#pa2"/>
      <use href="#pa3" stroke-width="4.5"/>
      <use href="#wave"/>
      <use href="#pu1"/><use href="#pu2" stroke-width="4.5"/>
      <use href="#re"/>
    </g>
    <use href="#star" fill="#FFB938" stroke="#FFB938" stroke-width="6"/>
  </g>

  <!-- ⑤ 高光：每个字左上方一道短胶囊加一颗小点，像软糖的反光 -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-linecap="round" stroke-width="6.5">
    <path d="M281.5 238 L280.3 222"/>
    <path d="M450.6 317 L453 305"/>
    <path d="M491 236 L492.4 250"/>
    <path d="M521.1 216.1 A40 44 0 0 1 532.4 212.4"/>
    <path d="M618.5 241.6 A41 45 0 0 1 629.6 223.6"/>
    <path d="M716 338 L718 354"/>
    <path d="M842 375 L839 390"/>
    <path d="M884.4 370.6 A39 45 0 0 1 894.9 352.6"/>
    <path d="M965.2 331.9 L971.1 346.7"/>
  </g>
  <g fill="#FFFFFF" fill-opacity=".9">
    <circle cx="282.6" cy="250" r="3.3"/>
    <circle cx="459" cy="260.5" r="3"/>
    <circle cx="493.5" cy="260" r="3"/>
    <circle cx="540.5" cy="212.3" r="3"/>
    <circle cx="639.7" cy="216.2" r="3.2"/>
    <circle cx="719.6" cy="365" r="3.3"/>
    <circle cx="837.6" cy="400" r="3"/>
    <circle cx="904.5" cy="345.2" r="3"/>
    <circle cx="974.9" cy="356" r="3"/>
    <circle cx="644" cy="404" r="3"/>
  </g>

  <!-- NEXT：右下角的端正标签，方头直角，与圆润的标题字形成对比 -->
  <g transform="translate(1066 425) scale(1.12)">
    <rect x="0" y="2" width="145" height="52" rx="10" transform="translate(8 8)" fill="#7DB4F2" stroke="#7DB4F2" stroke-width="16" stroke-linejoin="round"/>
    <rect x="0" y="0" width="145" height="52" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>
    <rect x="0" y="0" width="145" height="52" rx="10" fill="#253C7A"/>
    <use href="#next-glyphs" fill="#FFFFFF"/>
  </g>
</svg>
