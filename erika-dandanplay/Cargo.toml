[package]
name = "erika-dandanplay"
description = "Erika: the dandanplay service, through NipaPlay's gateways"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
url = "2"

# The browser would need its own fetch; there the service is not reached yet.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["cookies", "json"] }
# The Bangumi website's own pages, read with the user's session.
scraper = { version = "0.24", default-features = false }
regex = "1"
