[package]
name = "erika-dandanplay"
description = "Erika: the dandanplay service, through NipaPlay's gateways"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
erika-catalog.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
url = "2"

[dev-dependencies]
futures-lite = "2"

# Native adapters for account and website APIs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true, features = ["cookies", "json"] }
# The Bangumi website's own pages, read with the user's session.
scraper = { version = "0.24", default-features = false }
regex = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
js-sys = "0.3"
