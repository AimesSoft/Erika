[package]
name = "erika-core"
description = "Erika: the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["bern-module-account", "bern-module-danmaku", "bern-module-enhance", "bern-module-library", "bern-module-anime", "bern-module-sync", "bern-module-sources", "bern-module-remote", "bern-module-downloads"]
bern-module-account = ["erika-protocol/bern-module-account", "dep:scraper", "dep:regex"]
bern-module-danmaku = ["erika-protocol/bern-module-danmaku"]
bern-module-enhance = ["erika-protocol/bern-module-enhance"]
bern-module-library = ["erika-protocol/bern-module-library", "dep:erika-library-protocol"]
bern-module-anime = ["erika-protocol/bern-module-anime", "dep:erika-anime-protocol"]
bern-module-sync = ["erika-protocol/bern-module-sync"]
bern-module-sources = ["erika-protocol/bern-module-sources"]
bern-module-remote = ["erika-protocol/bern-module-remote"]
bern-module-downloads = ["erika-protocol/bern-module-downloads", "dep:erika-downloads-protocol"]

[dependencies]
serde_json = "1"
# Plugin packages (`.epk`) are zip archives.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Plugins' `README.md`, shown on their pages.
pulldown-cmark = { version = "0.13", default-features = false }
bern.workspace = true
erika-protocol.workspace = true
erika-store.workspace = true
erika-dandanplay.workspace = true
liberika-plugin.workspace = true
erika-downloads-protocol = { path = "../modules/downloads/protocol", optional = true }
erika-anime-protocol = { path = "../modules/anime/protocol", optional = true }
erika-library-protocol = { path = "../modules/library/protocol", optional = true }

# liberika plays where Bern hosts it as the media kernel.
[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
liberika.workspace = true
crossbeam-channel = "0.5"
png = "0.17"

# On Linux liberika draws with wgpu, through the wgpu-hal it keeps in-tree
# (`.cargo/config.toml` patches crates.io with it). The exact version keeps
# Cargo on that patch instead of a newer release; it follows liberika's
# `third_party/wgpu-hal`.
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
liberika = { workspace = true, features = ["wgpu"] }
wgpu-hal = "=29.0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", features = ["cookies", "json"] }
scraper = { version = "0.24", default-features = false, optional = true }
regex = { version = "1", optional = true }

# A debug build packs the plugins of the local `erika_plugins` folder for
# the market (`build.rs`).
[build-dependencies]
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Plugins run in Boa where the tests have no system JavaScript host.
[dev-dependencies]
bern-script = { version = "=0.1.0", features = ["boa"] }
