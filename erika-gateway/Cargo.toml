[package]
name = "erika-gateway"
description = "Erika: a dandanplay-style gateway before a danmaku server such as Misaka, knowing files by their fingerprints"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
erika-catalog.workspace = true
erika-dandanplay.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
url = "2"
